# A synthetic capacity file: every feature the renderer reads, none of anyone's real numbers.
# Its expected/*.json were rendered by the ORIGINAL hand-rolled renderer this package replaces,
# so the golden test proves the library byte-identical to it -- comments and all (raw hash).
host:
  name: lab
  threads: 12            # 6C/12T
  ram_mb: 24000
  cpu_overcommit: 1.25
  reserves_mb:
    hypervisor: 3000
    drill: 3000          # a monthly restore drill — the sealed guest runs inside it
    slack: 1000

guests:
  mon:
    vmid: 201
    cores: 3
    ram_mb: 4000
  pool-a:
    vmid: 202
    cores: 7
    ram_mb: 9000
  pool-b:
    vmid: 203
    cores: 2
    ram_mb: 2048
  pool-c:
    vmid: 204
    cores: 2
    ram_mb: 2500
    state: on_demand
    shares: drill
  old:
    vmid: 205
    cores: 2
    ram_mb: 4000
    state: stopped
    budgeted: false
  next:
    vmid: 206
    cores: 1
    ram_mb: 1024
    planned: true

runners:
  vm: pool-a
  max_total: 7
  cpu_overcommit: 2.0
  memory_overcommit: 2.0
  vm_reserve_mb: 1000
  mem_book_ratio: 1.5
  live_floor_mb: 900
  redecide: false
  defaults:
    cpus: 2
    memory_mb: 2048
    pids: 2048
    labels: [self-hosted, home]
  pools:
    svc:
      enabled: true
      min_idle: 1
      max_runners: 3
      peak_mb: 2000
      young_mb: 1200
    svc-big:
      repo: svc
      variable: CI_RUNNER_BIG
      enabled: true
      labels: [self-hosted, home-big]
      min_idle: 0
      max_runners: 2
      peak_mb: 3500
      starve_s: 0
    svc-main:
      repo: svc
      variable: CI_RUNNER_MAIN
      enabled: true
      labels: [self-hosted, home-main]
      min_idle: 1        # no max_runners: admission is the ceiling
      peak_mb: 600
      young_mb: 300
    web:
      enabled: true
      min_idle: 0
      peak_mb: 2400
    web-light:
      repo: web
      variable: CI_RUNNER_LIGHT
      enabled: true
      labels: [self-hosted, home-light]
      min_idle: 0
      peak_mb: 700
    docs: {enabled: true, min_idle: 0, peak_mb: 700, young_mb: 350}
    Pascal.Case: {enabled: true, min_idle: 0, peak_mb: 700}
    retired: {enabled: false, min_idle: 3, max_runners: 9}

secure_runners:
  vm: pool-b
  max_total: 2
  cpu_overcommit: 1.0
  memory_overcommit: 1.0
  vm_reserve_mb: 512
  defaults:
    cpus: 1
    memory_mb: 768
    pids: 512
    labels: [self-hosted, home-secure]
  pools:
    svc: {enabled: true, min_idle: 0, max_runners: 2, peak_mb: 512}
    web: {enabled: true, min_idle: 0, max_runners: 1, peak_mb: 512}
    ops: {enabled: true, min_idle: 0, peak_mb: 600, labels: [self-hosted, home-secure-ops]}

sealed_runners:
  vm: pool-c
  max_total: 1
  cpu_overcommit: 1.0
  memory_overcommit: 1.0
  vm_reserve_mb: 500
  defaults:
    cpus: 2
    memory_mb: 2000
    pids: 2048
    labels: [self-hosted, home-sealed]
  pools:
    svc: {enabled: true, min_idle: 0, max_runners: 1, peak_mb: 1800}
    web: {enabled: true, min_idle: 0, max_runners: 1, peak_mb: 1500}
