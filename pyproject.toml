[project]
name = "ci-kit"
version = "1.22.3"
description = "Reusable CI gates: the doc-reference gate, the secret-argv lint, the armed-PR updater, the pin-drift check, the agent-manual lint, the guard self-proof gate, the hand .env-read ratchet, the duplicate-code gate (jscpd behind a shrink-only baseline), the OpenAPI breaking-change gate (oasdiff), the skip-green CI aggregate gate (`workflow` extra), the pre-merge model review gate (`review` extra), the lint-gate kit (ratchet, discover, site_lint), and parsed-SQL gates behind the `sql` extra. Every gate exits 0 clean / 1 findings / 2 could-not-look."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# the SQL gates (ci_kit.sql) parse SQL with sqlglot; nothing else in the kit takes a dependency
sql = ["sqlglot>=30.13"]
# ci-gate-lint reads GitHub workflow YAML
workflow = ["pyyaml>=6.0.2"]
# the pre-merge model review gate (ci_kit.review): the api transport is pydantic-ai, the
# subscription transport serves the same tools over MCP to the Claude Code CLI
review = ["pydantic-ai-slim[anthropic]>=2.57,<3", "mcp>=2.3,<3"]

[project.scripts]
ci-doc-lint = "ci_kit.doc_lint:main"
ci-secret-argv-lint = "ci_kit.secret_argv:main"
ci-pr-autoupdate = "ci_kit.pr_autoupdate:main"
ci-pin-drift = "ci_kit.pin_drift:main"
ci-queue-wait = "ci_kit.queue_wait:main"
ci-manual-lint = "ci_kit.manual_lint:main"
ci-guard-selfproof = "ci_kit.guard_selfproof:main"
ci-env-reads = "ci_kit.env_reads:main"
ci-dup-code = "ci_kit.dup_code:main"
ci-api-diff = "ci_kit.api_diff:main"
ci-gitleaks = "ci_kit.gitleaks:main"
ci-tf-seed = "ci_kit.tf_seed:main"
ci-gate-lint = "ci_kit.ci_gate:main"
ci-version-tag = "ci_kit.version_tag:main"
ci-green = "ci_kit.ci_green:main"
ci-sql-casts = "ci_kit.sql.casts:main"
ci-pit-reads = "ci_kit.sql.pit_reads:main"
ci-decimal-reads = "ci_kit.sql.decimal_reads:main"
ci-phantom-columns = "ci_kit.sql.phantom_columns:main"
ci-column-comments = "ci_kit.sql.column_comments:main"
ci-review-tier = "ci_kit.review.tier:main"
ci-review-verdict = "ci_kit.review.verdict:main"
ci-review-carry = "ci_kit.review.carry:main"
ci-review-agent = "ci_kit.review.agent:main"
ci-review-claude = "ci_kit.review.claude:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ci_kit"]

[dependency-groups]
dev = [
    "json5>=0.17.3",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PLR0915"]

[tool.pytest.ini_options]
testpaths = ["tests"]
