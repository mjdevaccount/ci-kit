# ci-kit's own gate. Everything a caller gets is proven here first, against THIS checkout: the
# package through the local action (`uses: ./`), so a broken action.yml fails here and not in
# every caller at once; the must-fire suite (bad -> 1, good -> 0, blind -> 2); every selftest; and
# actionlint over the reusable workflows. Plus the kit's own gitleaks workflow, called the way a
# consumer calls it.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --frozen --all-extras   # the sql extra: ci_kit.sql needs sqlglot
      # The README's rule: `version` in pyproject.toml moves with each vX.Y.Z tag. Nothing checked
      # it, so v1.6.1, v1.7.0 and v1.7.1 were all cut from commits that still said 1.6.0. A tag is
      # immutable once pushed, so this cannot stop a stale one. It turns the NEXT PR red until
      # the version catches up, and a version bumped ahead of its tag passes. Exit 2 = could not read.
      - name: pyproject version is not behind the newest release tag
        run: |
          set -euo pipefail
          have=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)
          top=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          [ -n "$have" ] && [ -n "$top" ] || { echo "::error::could not read version ('$have') or newest tag ('$top')"; exit 2; }
          newest=$(printf '%s\n%s\n' "v$have" "$top" | sort -V | tail -1)
          [ "$newest" = "v$have" ] || { echo "::error::pyproject.toml version $have is behind release tag $top -- bump it (README: the two move together)"; exit 1; }
          echo "version $have, newest tag $top: ok"
      - name: ruff
        run: uv run ruff check --output-format=github .
      - name: must-fire suite
        run: uv run pytest -q
      # the action exactly as callers get it, from this checkout
      - name: doc gate on ci-kit itself (through the action)
        uses: ./
        with:
          tool: ci-doc-lint
      - name: doc gate selftest (through the action)
        uses: ./
        with:
          tool: ci-doc-lint
          args: --selftest
      - name: secret-argv selftest (through the action)
        uses: ./
        with:
          tool: ci-secret-argv-lint
          args: --selftest
      - name: secret-argv gate on ci-kit itself (through the action)
        uses: ./
        with:
          tool: ci-secret-argv-lint
      - name: env-reads selftest (through the action)
        uses: ./
        with:
          tool: ci-env-reads
          args: --selftest
      - name: dup-code gate on ci-kit itself (through the action; baseline ci/jscpd-baseline.json)
        uses: ./
        with:
          tool: ci-dup-code
      - name: dup-code selftest (a planted clone fires, a clean pair passes)
        uses: ./
        with:
          tool: ci-dup-code
          args: --selftest
      - name: api-diff selftest (a removed route + dropped field fire, an additive spec passes)
        uses: ./
        with:
          tool: ci-api-diff
          args: --selftest
      # The two tools that replaced a releases/download fetch (2026-11-08), run for REAL: the pinned
      # gitleaks binary through release_bin (sha256 + cache + REST fallback) over this event's own
      # commits, and a planted key must FIRE (exit 1) -- a scanner only ever seen passing proves
      # nothing. Then terraform's provider cache seeded from a fixture lock, cold then warm.
      - name: ci-gitleaks over this event's range (the pinned binary, no docker, no action)
        uses: ./
        with:
          tool: ci-gitleaks
          args: --mode range
      - name: ci-gitleaks must fire on a planted key (exit 1), and a zero-commit history is exit 2
        run: |
          set -uo pipefail
          d=$(mktemp -d); git -C "$d" init -q; git -C "$d" config user.email t@t; git -C "$d" config user.name t
          # a random base32 tail: gitleaks' AWS rule has an entropy floor, so a repeated char is skipped
          printf 'aws_access_key_id = AKIA%s\n' "$(head -c 10 /dev/urandom | base32)" > "$d/creds"
          git -C "$d" add creds; git -C "$d" commit -qm leak
          uvx --quiet --from . ci-gitleaks --mode history --source "$d"; rc=$?
          [ "$rc" = 1 ] || { echo "::error::planted key gave rc=$rc (want 1)"; exit 1; }
          e=$(mktemp -d); git -C "$e" init -q
          uvx --quiet --from . ci-gitleaks --mode history --source "$e"; rc=$?
          [ "$rc" = 2 ] || { echo "::error::empty history gave rc=$rc (want 2)"; exit 1; }
      - name: ci-tf-seed cold then warm (fixture lock, the live registry)
        run: |
          set -euo pipefail
          export TF_PLUGIN_CACHE_DIR="$RUNNER_TEMP/tfc"
          uvx --quiet --from . ci-tf-seed --dir tests/fixtures/tf 2>&1 | tee "$RUNNER_TEMP/cold.log"
          grep -q 'seeded into' "$RUNNER_TEMP/cold.log" || { echo "::error::cold run seeded nothing"; exit 1; }
          uvx --quiet --from . ci-tf-seed --dir tests/fixtures/tf 2>&1 | tee "$RUNNER_TEMP/warm.log"
          grep -q 'from cache' "$RUNNER_TEMP/warm.log" || { echo "::error::warm run did not read the cache"; exit 1; }
          ls "$TF_PLUGIN_CACHE_DIR"/registry.terraform.io/hashicorp/null/*/linux_amd64/terraform-provider-null_*
      - name: gate-lint selftest (through the action, which installs the workflow extra)
        uses: ./
        with:
          tool: ci-gate-lint
          args: --selftest
      - name: gate-lint on ci-kit's own ci.yml (through the action)
        uses: ./
        with:
          tool: ci-gate-lint
      - name: sql gate selftest (through the action, which installs the sql extra)
        uses: ./
        with:
          tool: ci-sql-casts
          args: --selftest
      - name: pin-drift blind direction (this repo pins nothing -> exit 2, never a clean 0)
        run: |
          set +e
          uvx --quiet --from . ci-pin-drift --file pyproject.toml --remote "https://github.com/$GITHUB_REPOSITORY.git"
          rc=$?
          set -e
          [ "$rc" -eq 2 ] || { echo "::error::expected exit 2 (no pin found), got $rc"; exit 1; }
      - name: manual-lint + guard-selfproof blind direction (no CLAUDE.md, no scripts/ here -> exit 2)
        run: |
          for tool in ci-manual-lint ci-guard-selfproof; do
            set +e
            uvx --quiet --from . "$tool"
            rc=$?
            set -e
            [ "$rc" -eq 2 ] || { echo "::error::$tool: expected exit 2 (nothing to look at), got $rc"; exit 1; }
          done
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:latest -color

  # renovate/default.json5 is the estate's ONE Renovate policy: every repo extends it from main,
  # so a typo merged here breaks Renovate everywhere and the only signal is a "Fix Renovate
  # Configuration" issue per repo, hours later. Validated as REPO config (`--no-global`: a preset
  # is repo-shaped; global mode skips repo-only checks), `--strict` so a needed migration is red.
  # The annotation manager's regex has its own must-fire test in the suite above.
  renovate-config:
    name: renovate config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: renovate-config-validator --strict on the preset and this repo's renovate.json
        env:
          # renovate: datasource=npm depName=renovate
          RENOVATE_VERSION: 44.216.5
        run: npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict --no-global renovate/default.json5 renovate.json

  gitleaks:
    name: gitleaks (secret scan)
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/gitleaks.yml
    with:
      mode: history
