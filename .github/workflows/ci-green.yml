# ci-green -- fast-forward a `ci-green` branch to every commit CI PASSED on the default branch.
#
# A box that builds from a checkout and follows `origin/main` deploys whatever merged, green or
# not. It follows `origin/ci-green` instead: that ref only ever holds commits whose push CI on the
# default branch concluded `success` (ci_kit/ci_green.py: create / advance non-force / older = no-op
# / diverged = red, never forced). The box needs no GitHub credential to read it.
#
# Caller (the `workflows:` name is YOUR CI workflow's `name:`):
#
#   name: ci-green
#   on:
#     workflow_run:
#       workflows: [CI]
#       types: [completed]
#       branches: [main]
#   permissions: {}
#   concurrency: { group: ci-green, cancel-in-progress: false }
#   jobs:
#     advance:
#       permissions: { contents: read }
#       uses: mjdevaccount/ci-kit/.github/workflows/ci-green.yml@v1
#       secrets:
#         token: ${{ secrets.PR_UPDATE_TOKEN }}   # whatever YOUR repo names it
#
# GUARD (the job's `if:`): the triggering run concluded `success`, ran on the DEFAULT branch, was a
# `push` or `workflow_dispatch` run (a PR run's head_sha never merged), and came from THIS repo (a
# fork's run can name `main` too). Anything else is skipped -- this workflow is not a required
# check, so a skip blocks nothing. `branches: [main]` in the caller is a filter on head_branch,
# which a fork also controls; the same-repo check is what closes that.
#
# CONCURRENCY no-cancel keeps a RUNNING advance from being killed mid-push. It does not queue
# everything: GitHub keeps ONE pending run per group and cancels it when another queues, and
# queue order is CI completion order, not commit order. So a newer green can be dropped behind an
# older one (rare: main's CI cancels superseded runs); the older advance still moves the branch,
# and the next merge catches up. A ci-green stuck that way past 2h is the consumer's lag page.
#
# The push is a fine-grained PAT (`token`: contents + workflows read/write on the caller), NOT
# GITHUB_TOKEN: GitHub refuses a GitHub-App push whose range adds or edits `.github/workflows/**`
# without the `workflows` permission, which GITHUB_TOKEN can never hold -- and the first advance
# after a caller merges contains the caller's own ci-green.yml, so GITHUB_TOKEN would stick the
# branch forever (review 2026-11-09, ledger 597). pr-autoupdate needs the same token for the same
# reason; callers map the one they already have. A PAT push fires `push` workflows on ci-green:
# keep every push trigger filtered to main. It holds a write token, so it NEVER joins the shared
# socket pool (CI_RUNNER); with
# the caller's CI_SECURE_RUNNER set it runs on the secure pool (home-host VM 111, no docker socket)
# in the `ci-secure` environment, whose default-branch-only policy a workflow_run job satisfies
# (it runs on the default branch). Hosted otherwise. CI_SECURE_RUNNER is an on/off switch; the
# labels are fixed here (as pr-autoupdate.yml).
#
# FAILURE: `diverged` (someone pushed ci-green by hand, or main was rewritten) and a refused push
# are exit 1 -> a red run on main's Actions page. A ci-green that silently stops advancing (this
# workflow disabled, the caller's `workflows:` name wrong) is NOT visible here: the consumer
# watches lag (local-mcp scripts/main_ci.py pages when ci-green trails a green main by too long).
name: ci-green

on:
  workflow_call:
    inputs:
      branch:
        description: the branch to fast-forward (never the default branch, main or master)
        type: string
        default: ci-green
      dry-run:
        description: print the plan, push nothing
        type: boolean
        default: false
    secrets:
      token:
        description: fine-grained PAT with contents + workflows read/write on the caller repo
        required: true

permissions:
  contents: read

jobs:
  advance:
    name: advance ci-green
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == github.event.repository.default_branch
      && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ${{ vars.CI_SECURE_RUNNER && fromJSON('["self-hosted","home-secure"]') || 'ubuntu-latest' }}
    environment: ${{ vars.CI_SECURE_RUNNER && 'ci-secure' || '' }}
    timeout-minutes: 5
    steps:
      - name: Refuse to run unconfigured
        env:
          TOKEN_SET: ${{ secrets.token != '' }}
        run: |
          if [ "$TOKEN_SET" != "true" ]; then
            echo "::error::secret 'token' is empty for $GITHUB_REPOSITORY: ci-green is NOT advancing and the box deploys nothing newer. Map a fine-grained token (contents + workflows: read/write) onto 'token'."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.token }}
          # the ancestry checks need main's history and the branch's; the tool fetches the branch
          fetch-depth: 0
      - name: Advance
        uses: mjdevaccount/ci-kit@v1
        with:
          tool: ci-green
          args: >-
            --sha ${{ github.event.workflow_run.head_sha }}
            --branch ${{ inputs.branch }}
            ${{ inputs.dry-run && '--dry-run' || '' }}
