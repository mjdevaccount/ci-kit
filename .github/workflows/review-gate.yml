# review-gate -- a pre-merge model reviewer whose verdict is a CI check auto-merge waits for.
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, ready_for_review]   # NO `labeled` (below)
#   permissions: { contents: read, pull-requests: write, actions: read }
#   concurrency: { group: review-gate-${{ github.event.pull_request.number }}, cancel-in-progress: true }
#   jobs:
#     review:
#       name: reviewer
#       uses: mjdevaccount/ci-kit/.github/workflows/review-gate.yml@v1
#       with:
#         guard-paths: |            # YOUR guard paths, dorny/paths-filter globs, one `- '...'` per line
#           - 'migrations/**'
#           - '.github/workflows/**'
#         charter: Your charter is REVIEW.md. Read it first and follow it.
#         git-ssh-repos: owner/private-dep  # optional: a private git dependency (below)
#       secrets:                    # the names are yours; map onto these
#         claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#         anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
#         ntfy-url: ${{ secrets.NTFY_URL }}                 # optional
#         git-ssh-key: ${{ secrets.DEPLOY_KEY }}            # optional, with git-ssh-repos
#     gate:                         # THE required check: one always() aggregate (ci-gate-lint's shape)
#       name: review gate
#       needs: [review]
#       if: always()
#       runs-on: ubuntu-latest
#       steps:
#         - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
#           with: { jobs: '${{ toJSON(needs) }}' }
#
# WHY (trade-data, 2026-09-26). PRs open READY with auto-merge armed at open; CI is the only merge
# gate. "Review a guard or a 3+ commit loop before merging" lived in session memory and lost every
# race: trade-data#2059 auto-merged 30s after opening, the reviewer's DO NOT SHIP arrived after.
# 41 of 134 closed reviewer dispatches found a blocking defect. Anthropic's managed Code Review
# never blocks a merge. Moved here from trade-data 2026-11-06 (scripts/review_gate_*.py ->
# ci_kit/review/), so every repo calls ONE gate.
#
# WHY REUSABLE CLOSES MOST OF THE SELF-GRADING HOLE. `pull_request` runs the PR HEAD's copy of a
# workflow, so a PR editing an in-repo gate was graded by its own edit (it could drop the tier,
# the prompt or the Gate step). Here the policy, the prompt, the tools and the verdict all run from
# ci-kit at the caller's pinned ref; a caller PR can only edit its STANZA (the ref, the inputs, the
# aggregate). That residual wants a session reviewer on any diff to the caller file. Still open,
# as before: the review job runs the PR's own pytest as the runner user, which can read the
# credential and rewrite the installed gate under $RUNNER_TEMP. Fork heads get no secrets.
#
# ALWAYS RUNS, NEVER SKIPS. A required check that is path-filtered at the trigger never reports on
# an out-of-tier PR, and a job skipped by a job-level `if:` counts as PASSED. So the job always
# starts and a STEP decides (ci_kit.review.tier): every code PR is reviewed; guard path / 3+
# non-merge commits / the label are the REASONS it reads; a docs/lockfile-only diff passes with no
# model call. The check name is `<caller job> / review`, so the caller's `review gate` aggregate
# above is what branch protection lists -- it keeps a pre-existing check name, and `record`
# (continue-on-error) can never turn it red.
#
# FIVE JOBS, ONE VERDICT (v1.29.0). `review` (job id `decide`, the SECURE pool) runs everything
# that executes no PR code -- train, tier, carry, admission, siblings -- and finishes a carry, a
# BLIND or a train itself. `model review` (the SEALED pool) runs only for a full review. `review
# deferred` is red when the PR queue parked the review. `verdict` is the in-workflow aggregate: a
# skipped `model review` passes only when `decide` said none was needed. `record verdict` writes
# the carry record. A base-only update of a passed PR never waits for the one sealed runner.
#
# THE PR QUEUE (`queue-priority`, v1.29.0). The sealed pool is ONE runner. A PR numbered after
# the queue head (the lowest-numbered armed PR, ci_kit/pr_queue.head) does not start a full
# review while the head needs that pool; its run ends red at `review deferred`, labelled
# `queue:parked`, and the caller's pr-autoupdate re-runs it (ci_kit/pr_sched). ORDER AND TIMING
# ONLY: every PR is still reviewed in full, or carried under the rule above, at its merging head.
#
# A MERGE TRAIN IS NOT RE-REVIEWED, AND NOT WAVED THROUGH (v1.25.0). A PR whose head branch is
# `train/*` (ci-merge-train, merge-train.yml) skips the tier and the model: ci_kit.review.train
# proves every commit on it is ONE constituent's squash -- its tree recomputed byte-for-byte from
# the PR's head named in the commit's trailers -- AND that the constituent's own review-gate run
# PASSED at exactly that head. Anything else (a stray byte, an unbound commit, an unreviewed or
# moved head, a merge commit, a fork) is block; a verifier that could not finish is BLIND. Both
# are red. The `train/` prefix is the key in both directions: a hand-made `train/` branch is
# verified, never reviewed, and so cannot pass unless it IS a train.
#
# FAILS CLOSED. In the tier with no credential (UNARMED), a fork head, a reviewer that crashed,
# timed out or wrote no parseable verdict = BLIND = RED, with the cause in the PR comment.
#
# TWO TRANSPORTS, ONE TOGGLE: the caller repo's VARIABLE REVIEW_GATE_AUTH (or input auth-mode) =
# subscription (claude-code-oauth-token, the Claude Code CLI) | api (anthropic-api-key, pydantic-ai
# on the plain Messages API) | auto/unset (subscription first). Only the chosen credential reaches
# the Review step: with both set, `claude -p` would prefer the API key and bill the account the
# subscription mode exists to spare. mcp/scripts/review_gate_auth.py flips every repo at once.
#
# CARRIED VERDICTS: the armed-PR updater merges main into every armed PR; each move re-runs this.
# When the PR's OWN diff (merge-base..head) hashes the same as one a previous run PASSED, it passes
# with "verdict carried from <sha>" and no model run (ci_kit.review.carry). The record is an
# ARTIFACT written by the separate `record` job (a comment is editable by any token holder).
#
# A PRIVATE GIT DEPENDENCY (v1.24.0): a caller whose lockfile installs a private GitHub repo by
# https URL passes `git-ssh-repos: owner/name` and `secrets: git-ssh-key:` (a read-only deploy
# key). Without them `install` cannot fetch it and every reviewed PR is red. Two private repos
# (v1.28.0): name both, and pass one deploy key per repo in the same order (a deploy key reads ONE
# repo): `git-ssh-key: |` then each secret on its own line; each key gets its own agent and host alias. The key lives in its
# own step, where no PR code runs; Install gets only the agent's socket, an env-scoped rewrite of
# just those repos and GitHub's pinned host keys; the agent is killed before Review
# (ci_kit/git_ssh.sh). Named repos + an empty key = loud red.
#
# THE GATE'S CODE: `kit-ref` (default v1) is fetched into $RUNNER_TEMP and its locked `review`
# extra synced there -- the reviewer never runs in the caller's venv. The comment names the ref,
# version and sha that graded the PR. kit-ref exists for a bootstrap or a test of an unreleased
# change; a caller pinned to @v1 leaves it alone.
name: review-gate

on:
  workflow_call:
    inputs:
      guard-paths:
        description: >-
          The caller's guard paths as dorny/paths-filter globs, one YAML list item per line
          (`- 'migrations/**'`). A guard path is a REASON the reviewer reads and moves the review
          to `guard-model`; it never decides whether the review runs.
        type: string
        required: true
      label:
        description: the PR label that adds a reason; must be on the PR AT OPEN (no `labeled` trigger)
        type: string
        default: review:required
      charter:
        description: the repo's review charter, appended to the prompt (which files to read, what to hunt)
        type: string
        default: If the repository has a REVIEW.md, read it first and follow it.
      install:
        description: the command that installs the caller's project, so the reviewer can run its tests
        type: string
        default: uv sync --all-groups --frozen
      python-version:
        description: setup-uv python-version for the caller's project ('' = uv's choice)
        type: string
        default: ""
      model:
        description: the reviewer's model
        type: string
        default: claude-sonnet-5-5
      guard-model:
        description: the reviewer's model when a guard path is in the diff
        type: string
        default: claude-opus-5-5
      not-prose:
        description: space-separated path prefixes never read as prose by the docs-only skip
        type: string
        default: .claude/ prompts/
      auth-mode:
        description: subscription | api | auto ('' = the caller repo's REVIEW_GATE_AUTH variable, else auto)
        type: string
        default: ""
      claude-code-version:
        description: the subscription transport's pinned Claude Code CLI
        type: string
        # renovate: datasource=npm depName=@anthropic-ai/claude-code
        default: 2.1.318
      kit-ref:
        description: the ci-kit ref whose ci_kit.review grades the PR (a tag, branch or sha)
        type: string
        default: v1
      git-ssh-repos:
        description: >-
          PRIVATE GitHub repos (`owner/name`, space- or newline-separated) the caller's `install`
          fetches by https URL; with the `git-ssh-key` secret they are routed to ssh for the
          Install step only (ci_kit/git_ssh.sh). Set this and an empty key fails loud. '' = off.
          git insteadOf is a PREFIX match: `o/r` also routes `o/r-extra` (red, never silent).
        type: string
        default: ""
      train-workflow:
        description: >-
          the caller's merge-train workflow file: a `train/` PR passes only if its composition
          record names a run of THIS workflow that opened it (ci_kit/merge_train/github.composed)
        type: string
        default: merge-train.yml
      queue-priority:
        description: >-
          the PR scheduler's admission (v1.29.0, ci_kit/pr_sched.py): a full review of a PR
          numbered after the queue head is PARKED while the head needs the sealed pool, and
          re-run by pr-autoupdate (pass its `scarce-pools`). Order and timing only: a parked PR is
          red until reviewed. false = every review runs at once, as before.
        type: boolean
        default: false
    secrets:
      git-ssh-key:
        description: >-
          optional; a read-only (deploy) key for `git-ssh-repos`, held only by the step that
          loads it into an ssh-agent; Install may use the agent, which is killed before Review.
          Several private repos (v1.28.0): ONE key per repo, concatenated in the order
          `git-ssh-repos` names them (a `|` block of two secrets); each gets its own agent
        required: false
      claude-code-oauth-token:
        description: the `subscription` credential (`claude setup-token`)
        required: false
      anthropic-api-key:
        description: the `api` credential
        required: false
      ntfy-url:
        description: optional; a block or BLIND is pushed here (priority 3)
        required: false
    outputs:
      result:
        description: pass | block | blind | parked ('' when the diff was not in the tier)
        value: ${{ jobs.review.outputs.result || jobs.decide.outputs.result }}

jobs:
  decide:
    # Everything that runs NO PR code and needs no model credential, on the SECURE pool (v1.29.0):
    # the merge-train verifier, the tier, the CARRY, the PR scheduler's admission and the siblings
    # list. It checks the PR out (git reads it: `diff`, `merge-base`, `hash-object`; nothing is
    # executed from it, PYTHONSAFEPATH=1 keeps a PR-added ci_kit/ off the path) and holds only the
    # job's GITHUB_TOKEN -- the token-only class the secure pool exists for (home-host
    # docs/CI-RUNNER.md § The secure pool). WHY: the sealed pool is ONE runner, one job per VM boot,
    # and 72% of its jobs (11-07..11-14, 246 of 342) were this job's carry path, ~0.2 min of work
    # each behind a reboot and the queue for that single runner. td#3073, verdict recorded 03:58Z
    # 11-14, BEHIND main: its 30-second carry had to wait for another PR's full review to finish.
    # Now a base-only update of a passed PR never touches the sealed pool; the sealed job runs only
    # for a full review. Named `review` (the old job's name): mcp review_gate_auth.py reads this
    # job's log for the tier's lines. Unset CI_SECURE_RUNNER = hosted, as before.
    name: review
    runs-on: ${{ vars.CI_SECURE_RUNNER && fromJSON('["self-hosted","home-secure"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      PYTHONSAFEPATH: "1"
    permissions:
      contents: read
      pull-requests: write   # the verdict comment (carried / BLIND / train), the `queue:parked` label
      actions: read          # the carry's artifact; the scheduler's read of the head's jobs
    outputs:
      # frozen at each step's end; `review`, `record` and `verdict` read them
      mode: ${{ steps.mode.outputs.mode }}
      result: ${{ steps.verdict.outputs.result || steps.train.outputs.result || steps.mode.outputs.result }}
      hash: ${{ steps.carry.outputs.hash }}
      origin: ${{ steps.carry.outputs.origin }}
      why: ${{ steps.carry.outputs.why }}
      kit-sha: ${{ steps.kit.outputs.sha }}
      gate: ${{ steps.kit.outputs.label }}
      reasons: ${{ steps.decide.outputs.reasons }}
      model: ${{ steps.decide.outputs.model }}
      credential: ${{ steps.decide.outputs.credential }}
      credential-name: ${{ steps.decide.outputs.credential_name }}
      schema: ${{ steps.decide.outputs.schema }}
      siblings: ${{ steps.siblings.outputs.text }}
      parked: ${{ steps.admit.outputs.why }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch the gate (ci-kit at kit-ref)
        id: kit
        env:
          KIT_REF: ${{ inputs.kit-ref }}
        run: |
          set -euo pipefail
          kit="$RUNNER_TEMP/ci-kit"
          git init -q "$kit"
          git -C "$kit" fetch -q --depth 1 https://github.com/mjdevaccount/ci-kit.git "$KIT_REF"
          git -C "$kit" checkout -q --detach FETCH_HEAD
          sha=$(git -C "$kit" rev-parse HEAD)
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$kit/pyproject.toml" | head -1)
          ref=$(printf '%s' "$KIT_REF" | tr -cd 'A-Za-z0-9._/-' | cut -c1-64)
          {
            echo "dir=$kit"
            echo "sha=$sha"   # `model review` fetches exactly this commit: one gate per run
            echo "label=ci-kit $ref (${version:-?}, ${sha:0:7})"
          } >> "$GITHUB_OUTPUT"
          echo "Gate: ci-kit $ref (${version:-?}, ${sha:0:7})" >> "$GITHUB_STEP_SUMMARY"

      # THE MERGE TRAIN (v1.25.0, ci_kit/review/train.py). A PR whose head branch is `train/...`
      # is a train ci-merge-train composed: one commit per already-reviewed PR. It is VERIFIED --
      # its composition record names a run of the caller's merge-train workflow that opened it;
      # every commit byte-equal to its PR's reviewed head applied onto the commit before it, with
      # the context the review read; that PR's gate passed at that head AGAINST THIS BASE (a run
      # created after the PR's last base change, from its timeline) -- and never sent to the
      # model; anything else on a `train/` branch is red. The branch prefix alone keys it, so a hand PR cannot dodge review
      # by naming its branch (it fails here) and a train cannot reach the model. is_train is set
      # BEFORE python runs: a crash leaves the step failed and the Gate below reads no result,
      # which is BLIND -- red either way.
      - name: Merge train
        id: train
        if: startsWith(github.event.pull_request.head.ref, 'train/')
        env:
          PYTHONPATH: ${{ steps.kit.outputs.dir }}
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          TRAIN_WORKFLOW: ${{ inputs.train-workflow }}
          GATE: ${{ steps.kit.outputs.label }}
        run: |
          set -euo pipefail
          echo "is_train=true" >> "$GITHUB_OUTPUT"
          python3 -m ci_kit.review.train --body-out body.md

      # dorny reads a filter FILE (no ':' or newline in the input), so the caller's list keeps its
      # own YAML; an empty list is a YAML null, which dorny refuses -> red, never a silent no-guard
      - name: Guard paths
        if: steps.train.outputs.is_train != 'true'
        env:
          GUARD_PATHS: ${{ inputs.guard-paths }}
        run: |
          set -euo pipefail
          { echo 'guard:'; printf '%s\n' "$GUARD_PATHS" | sed -e '/^[[:space:]]*$/d' -e 's/^[[:space:]]*/  /'; } \
            > "$RUNNER_TEMP/review-gate-filters.yml"
          cat "$RUNNER_TEMP/review-gate-filters.yml"
      - uses: dorny/paths-filter@v4
        id: tier
        if: steps.train.outputs.is_train != 'true'
        with:
          list-files: shell
          filters: ${{ runner.temp }}/review-gate-filters.yml

      - name: Decide
        id: decide
        if: steps.train.outputs.is_train != 'true'
        env:
          PYTHONPATH: ${{ steps.kit.outputs.dir }}
          GUARD: ${{ steps.tier.outputs.guard }}
          GUARD_FILES: ${{ steps.tier.outputs.guard_files }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, inputs.label) }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GH_TOKEN: ${{ github.token }}   # the bump skip reads each bot commit's signature
          HAS_KEY: ${{ secrets.anthropic-api-key != '' }}
          HAS_OAUTH: ${{ secrets.claude-code-oauth-token != '' }}
          AUTH_MODE: ${{ inputs.auth-mode || vars.REVIEW_GATE_AUTH }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MODEL: ${{ inputs.model }}
          GUARD_MODEL: ${{ inputs.guard-model }}
          LABEL: ${{ inputs.label }}
          NOT_PROSE: ${{ inputs.not-prose }}
        run: |
          set -euo pipefail
          np=()
          for p in $NOT_PROSE; do np+=(--not-prose "$p"); done
          python3 -m ci_kit.review.tier --model "$MODEL" --guard-model "$GUARD_MODEL" --label "$LABEL" "${np[@]}"
          echo "schema=$(python3 -m ci_kit.review.verdict --print-schema)" >> "$GITHUB_OUTPUT"

      - name: Carry
        id: carry
        if: steps.decide.outputs.required == 'true' && steps.decide.outputs.blind == ''
        env:
          PYTHONPATH: ${{ steps.kit.outputs.dir }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          # the CALLER's workflow file (github.* is the caller's context): its runs hold the records
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -uo pipefail
          wf=${WORKFLOW_REF%@*}; wf=${wf##*/}
          # exit 2 = could not finish looking: that is NO carry (a full review), never a pass --
          # and no hash output, so the `record` job records nothing for this run
          python3 -m ci_kit.review.carry carry --repo "$GITHUB_REPOSITORY" --pr "$PR" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --branch "$HEAD_REF" --run-id "$GITHUB_RUN_ID" \
            --workflow "$wf" \
            || printf 'carried=false\nhash=\nwhy=carry check did not finish; full review\n' >> "$GITHUB_OUTPUT"

      # THE PR SCHEDULER'S ADMISSION (v1.29.0, `queue-priority`; policy ci_kit/pr_queue.py, actor
      # ci_kit/pr_sched.py). A full review needs the sealed pool, ONE runner. A PR numbered after
      # the queue head is PARKED while the head needs that pool (a sealed job queued, a run still
      # deciding, or parked itself); otherwise -- the head, a PR ahead of it, a head that needs
      # nothing there -- it runs (work-conserving). Parked = this run ends red at `review deferred`
      # and the PR gets `queue:parked`; pr-autoupdate re-runs it when it is the head or the pool is
      # free. The review is never skipped: a parked PR cannot merge until it is reviewed. A failed
      # look RUNS the review (never parks blind).
      - name: Admit
        id: admit
        if: >-
          inputs.queue-priority && steps.decide.outputs.required == 'true' && steps.decide.outputs.blind == ''
          && steps.carry.outputs.carried != 'true'
        env:
          PYTHONPATH: ${{ steps.kit.outputs.dir }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          POOL: ${{ vars.CI_SEALED_RUNNER && 'home-sealed' || '' }}
        run: |
          python3 -m ci_kit.pr_sched --repo "$GITHUB_REPOSITORY" --pr "$PR" --pool "$POOL" --pending \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            || printf 'defer=false\nwhy=admission crashed; reviewing\n' >> "$GITHUB_OUTPUT"

      - name: Siblings
        id: siblings
        if: >-
          steps.decide.outputs.required == 'true' && steps.decide.outputs.blind == ''
          && steps.carry.outputs.carried != 'true' && steps.admit.outputs.defer != 'true'
        env:
          PYTHONPATH: ${{ steps.kit.outputs.dir }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -m ci_kit.review.carry siblings --repo "$GITHUB_REPOSITORY" --pr "$PR" \
            --base "$BASE_SHA" --head "$HEAD_SHA" \
            || echo "text=(sibling list unavailable: the lookup failed)" >> "$GITHUB_OUTPUT"

      # ONE word for what happens next. `review` is the ONLY mode that runs the sealed job, and the
      # `verdict` aggregate refuses a skipped `review` in that mode, so a skip can never read as a pass.
      - name: Mode
        id: mode
        env:
          IS_TRAIN: ${{ steps.train.outputs.is_train }}
          REQUIRED: ${{ steps.decide.outputs.required }}
          BLIND: ${{ steps.decide.outputs.blind }}
          CARRIED: ${{ steps.carry.outputs.carried }}
          DEFER: ${{ steps.admit.outputs.defer }}
        run: |
          set -euo pipefail
          if [ "$IS_TRAIN" = true ]; then mode=train
          elif [ "$REQUIRED" != true ]; then mode=skip
          elif [ -n "$BLIND" ] || [ "$CARRIED" = true ]; then mode=finish
          elif [ "$DEFER" = true ]; then mode=defer; echo "result=parked" >> "$GITHUB_OUTPUT"
          else mode=review
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "review gate mode: $mode" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verdict
        id: verdict
        if: steps.mode.outputs.mode == 'finish'
        env:
          PYTHONPATH: ${{ steps.kit.outputs.dir }}
          BLIND: ${{ steps.decide.outputs.blind }}
          REASONS: ${{ steps.decide.outputs.reasons }}
          GATE: ${{ steps.kit.outputs.label }}
          CARRY_WHY: ${{ steps.carry.outputs.why }}
        run: |
          set -euo pipefail
          if [ -z "$BLIND" ]; then
            # the PR's own diff has the same hash as one a previous run PASSED: only main moved
            {
              echo "<!-- review-gate -->"
              echo "### review gate"
              echo
              echo "In the review tier because: $REASONS"
              echo
              echo "**PASS, $CARRY_WHY** -- the PR's own diff is unchanged since that review (only main moved), so the reviewer was not re-run."
            } > body.md
            echo "result=pass" >> "$GITHUB_OUTPUT"
            echo "title=review gate passed: $CARRY_WHY" >> "$GITHUB_OUTPUT"
            cat body.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          REASONS="$REASONS; BLIND: $BLIND"
          REVIEW_JSON="" python3 -m ci_kit.review.verdict --reasons "$REASONS" --body-out body.md
          echo "_gate: ${GATE}_" >> body.md
          cat body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the PR
        if: (steps.mode.outputs.mode == 'finish' || steps.train.outputs.is_train == 'true') && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [ -f body.md ] || echo "<!-- review-gate -->"$'\n'"review gate: the verdict step did not run" > body.md
          # one sticky comment, found by its marker, so a re-review edits instead of piling up
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
                 -q '.[] | select(.body | startswith("<!-- review-gate -->")) | .id' | tail -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@body.md >/dev/null
          else
            gh pr comment "$PR" --body-file body.md
          fi

      - name: Push a block to ntfy
        # A blocked PR with no live session sits silently until someone looks; this is the push.
        # Priority 3: a PR is never a reason to wake the operator.
        if: (steps.mode.outputs.mode == 'finish' || steps.train.outputs.is_train == 'true') && (steps.verdict.outputs.result || steps.train.outputs.result) != 'pass' && steps.decide.outputs.unarmed != 'true' && !cancelled()
        env:
          NTFY_URL: ${{ secrets.ntfy-url }}
          TITLE: ${{ steps.verdict.outputs.title || steps.train.outputs.title || 'review gate did not produce a verdict' }}
          URL: ${{ github.event.pull_request.html_url }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.event.repository.name }}
          # via env, never ${{ }} inside `run:` -- a PR title is attacker-shaped text
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if [ -z "${NTFY_URL:-}" ]; then echo "::warning::ntfy-url unset; the block was not pushed"; exit 0; fi
          curl -fsS -X POST "$NTFY_URL" -H "Title: $REPO #$PR: $TITLE" \
            -H "Priority: 3" -H "Tags: mag" -H "Click: $URL" \
            --data-binary "$PR_TITLE" >/dev/null \
            || echo "::warning::ntfy push failed"

      - name: Gate
        if: (steps.mode.outputs.mode == 'finish' || steps.train.outputs.is_train == 'true') && !cancelled()
        env:
          RESULT: ${{ steps.verdict.outputs.result || steps.train.outputs.result }}
        # INLINE, never a script under $RUNNER_TEMP: in `review` the PR's own tests have run by now
        # and could rewrite any file there; this YAML they cannot reach
        run: |
          case "$RESULT" in
            pass) echo "review gate: pass" ;;
            block) echo "::error::review gate BLOCKED -- see the PR comment"; exit 1 ;;
            *) echo "::error::review gate BLIND ($RESULT) -- the reviewer did not finish looking"; exit 1 ;;
          esac

  review:
    # THE FULL MODEL REVIEW, and only that (v1.29.0): `decide` above runs everything else. THE
    # SEALED POOL when the caller sets CI_SEALED_RUNNER, hosted otherwise (the kill switch). This
    # job holds the Claude credential AND runs the PR's own tests, so it may run only where a job
    # is alone with its machine: home-host VM 112, one job per boot, rolled back to a clean
    # snapshot before every start, no other job on the box and the LAN walled off (home-host
    # docs/CI-RUNNER-CONFIG-PLAN.md § Sealed pool). NEVER the secure pool (VM 111 runs several jobs
    # side by side) nor the socket pool. Labels fixed HERE (an ON/OFF switch, never a label list).
    # The pool's per-job ceiling is 45 min, the same as timeout-minutes below. vars resolve to the CALLER.
    name: model review
    needs: decide
    if: needs.decide.outputs.mode == 'review'
    runs-on: ${{ vars.CI_SEALED_RUNNER && fromJSON('["self-hosted","home-sealed"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      # every `python -m ci_kit...` runs with the PR checkout as cwd, and -m puts the cwd AHEAD of
      # PYTHONPATH: a PR-added ci_kit/ would replace the gate that grades it. Cleared in Install (the
      # caller's own build) and in the reviewer's tool runs (tools.VENV_ENV). v1.15.1.
      PYTHONSAFEPATH: "1"
    permissions:
      contents: read
      pull-requests: write   # the verdict comment; the `queue:parked` label
      actions: read          # the scheduler's read of the head's jobs
    outputs:
      # frozen at each step's end; the `record` job reads them on a runner the PR's code never ran on
      result: ${{ steps.verdict.outputs.result || (steps.admit.outputs.defer == 'true' && 'parked' || '') }}
      parked: ${{ steps.admit.outputs.defer }}
    steps:
      - name: Fetch the gate (the ci-kit commit `decide` ran)
        id: kit
        env:
          KIT_SHA: ${{ needs.decide.outputs.kit-sha }}
          GATE: ${{ needs.decide.outputs.gate }}
        run: |
          set -euo pipefail
          kit="$RUNNER_TEMP/ci-kit"
          git init -q "$kit"
          git -C "$kit" fetch -q --depth 1 https://github.com/mjdevaccount/ci-kit.git "$KIT_SHA"
          git -C "$kit" checkout -q --detach FETCH_HEAD
          echo "dir=$kit" >> "$GITHUB_OUTPUT"
          echo "Gate: $GATE" >> "$GITHUB_STEP_SUMMARY"

      # THE SCHEDULER'S LAST LOOK, before the PR is even checked out. GitHub hands a freed sealed
      # runner to any queued job and, measured, often NOT the oldest: in 46 of 90 inversions
      # (11-07..11-14) a higher-numbered PR's review was dispatched while the queue head's was
      # already waiting. Such a job yields at once (parked, re-run later) instead of holding the one
      # sealed runner for a full review. A head merely still DECIDING does not count here (no
      # --pending): the runner is ours now, and most decisions end in a carry that needs none.
      - name: Admit
        id: admit
        if: inputs.queue-priority
        env:
          PYTHONPATH: ${{ steps.kit.outputs.dir }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          POOL: ${{ vars.CI_SEALED_RUNNER && 'home-sealed' || '' }}
        run: |
          python3 -m ci_kit.pr_sched --repo "$GITHUB_REPOSITORY" --pr "$PR" --pool "$POOL" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            || printf 'defer=false\nwhy=admission crashed; reviewing\n' >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.admit.outputs.defer != 'true'
        with:
          fetch-depth: 0

      # the reviewer's first move is proving a guard's red path, which needs the real toolchain
      - uses: astral-sh/setup-uv@v10.3.3
        if: steps.admit.outputs.defer != 'true'
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true
      # node for the caller's `install` and the CLI below: the hosted image ships it, the SEALED
      # pool's does not (2026-11-09: `npm: command not found`, exit 127, the gate BLIND on its first
      # sealed run). Gated as Install, so a caller's `install: npm ci` finds node too. A failed
      # setup-node must still reach Review (as a failed install does), which names the BLIND's
      # cause. No package-manager cache: the caller's lockfile is not this CLI's.
      - uses: actions/setup-node@v7
        if: steps.admit.outputs.defer != 'true'
        continue-on-error: true
        with:
          node-version: 26
          package-manager-cache: false
      # A PRIVATE GIT DEPENDENCY (v1.24.0), three steps (ci_kit/git_ssh.sh): the key exists ONLY
      # here, where no PR code runs (Install runs the caller's build, which could read a key from
      # its parent shell's /proc environ even after `unset`); Install gets the agent's socket and
      # can use the key (never read it -- unless it has root: a hosted runner's sudo can dump the
      # agent's memory, so the key must be read-only and one repo); the agent is killed before
      # Review. A caller passing neither input: this step exits at its first line, and Install
      # and the kill step run as before.
      - name: Load the git ssh key
        id: gitssh
        if: steps.admit.outputs.defer != 'true'
        env:
          KIT: ${{ steps.kit.outputs.dir }}
          CI_KIT_GIT_SSH_REPOS: ${{ inputs.git-ssh-repos }}
          CI_KIT_GIT_SSH_KEY: ${{ secrets.git-ssh-key }}
        run: |
          set -euo pipefail
          if [ -z "$CI_KIT_GIT_SSH_REPOS" ] && [ -z "$CI_KIT_GIT_SSH_KEY" ]; then exit 0; fi
          # repos named + an EMPTY key (fork/Dependabot PR, unmapped secret) = a loud red here
          bash "$KIT/ci_kit/git_ssh.sh" load "$GITHUB_OUTPUT"
      - name: Install
        if: steps.admit.outputs.defer != 'true'
        env:
          KIT: ${{ steps.kit.outputs.dir }}
          INSTALL: ${{ inputs.install }}
          PYTHONSAFEPATH: ""   # the caller's project builds and imports as it does locally
          # '' unless the load step ran: no key here, only the agent's socket
          CI_KIT_GIT_SSH_SOCK: ${{ steps.gitssh.outputs.sock }}
          CI_KIT_GIT_SSH_KNOWN_HOSTS: ${{ steps.gitssh.outputs.known-hosts }}
          # '' with one key; with one key per repo (v1.28.0) the per-repo host aliases route reads
          CI_KIT_GIT_SSH_CONFIG: ${{ steps.gitssh.outputs.ssh-config }}
          CI_KIT_GIT_SSH_REPOS: ${{ inputs.git-ssh-repos }}
        run: |
          set -euo pipefail
          # the gate's own locked deps, in ITS venv: never the caller's
          uv sync --project "$KIT" --frozen --no-dev --extra review
          if [ -n "$CI_KIT_GIT_SSH_SOCK" ]; then
            export SSH_AUTH_SOCK="$CI_KIT_GIT_SSH_SOCK"
            # env-scoped https->ssh rewrite of the named repos + pinned host keys, this shell only
            . "$KIT/ci_kit/git_ssh.sh" route
          fi
          eval "$INSTALL"
      - name: Stop the git ssh agent
        # always(): a failed or cancelled install must not leave the agent to the PR's tests
        if: always() && steps.gitssh.outputs.pid != ''
        env:
          KIT: ${{ steps.kit.outputs.dir }}
          AGENT_PID: ${{ steps.gitssh.outputs.pid }}
        run: bash "$KIT/ci_kit/git_ssh.sh" kill "$AGENT_PID"
      - name: Install Claude Code
        # the subscription transport's CLI, pinned. A failed install must still reach Review, which
        # names it as the BLIND's cause (claude not found) instead of skipping the verdict.
        if: steps.admit.outputs.defer != 'true' && needs.decide.outputs.credential == 'oauth'
        continue-on-error: true
        env:
          CLAUDE_CODE_VERSION: ${{ inputs.claude-code-version }}
        run: npm install -g --no-fund --no-audit "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" && claude --version

      - name: Review
        id: review
        if: steps.admit.outputs.defer != 'true'
        # a failed or timed-out review must still reach Verdict, which reads the missing output as BLIND
        continue-on-error: true
        # below the job timeout, so a hang lands in continue-on-error -> BLIND with comment + push
        timeout-minutes: 35
        run: |
          if [ "$CREDENTIAL" = "oauth" ]; then transport=claude; else transport=agent; fi
          "$KIT/.venv/bin/python" -m "ci_kit.review.$transport" --model "$MODEL" --schema "$SCHEMA"
        env:
          KIT: ${{ steps.kit.outputs.dir }}
          CREDENTIAL: ${{ needs.decide.outputs.credential }}
          # ONLY the chosen credential reaches the step
          CLAUDE_CODE_OAUTH_TOKEN: ${{ needs.decide.outputs.credential == 'oauth' && secrets.claude-code-oauth-token || '' }}
          ANTHROPIC_API_KEY: ${{ needs.decide.outputs.credential == 'api_key' && secrets.anthropic-api-key || '' }}
          MODEL: ${{ needs.decide.outputs.model }}
          SCHEMA: ${{ needs.decide.outputs.schema }}
          REVIEW_PROMPT: |
            You are the reviewer for ${{ github.repository }}, running as its pre-merge CI gate.
            ${{ inputs.charter }}
            You may read the code and run git, ruff and pytest; you never edit.

            PR #${{ github.event.pull_request.number }} (read its title and body with git log; judge the diff, not the description)
            Diff under review: git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
            Commits: git log --oneline ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
            Why this PR is in the review tier: ${{ needs.decide.outputs.reasons }}

            Open sibling PRs whose changed files intersect this one (context only; they may merge
            before or after this PR -- look for a SEMANTIC collision with this diff, e.g. a name
            one renames and another reads):
            ${{ needs.decide.outputs.siblings }}

            Read the diff before the description. For every guard the diff adds or edits, name the
            execution path that makes it fire and prove its red path (run the test, or mutate and
            re-run). Report findings only.

            Return the structured output:
            - ship: SHIP, SHIP WITH NOTED RISK, or DO NOT SHIP.
            - findings: most severe first, each with severity (blocking, risk or note), verdict
              (CONFIRMED if you traced it, PLAUSIBLE if you suspect it), file, line, summary and a
              concrete failure_scenario.
            - not_reviewed: what you did not check, and why.
            A CONFIRMED blocking finding means DO NOT SHIP.

      - name: Verdict
        id: verdict
        if: steps.admit.outputs.defer != 'true'
        env:
          PYTHONPATH: ${{ steps.kit.outputs.dir }}
          REVIEW_JSON: ${{ steps.review.outputs.structured_output }}
          CAUSE: ${{ steps.review.outputs.cause }}
          CRED_NAME: ${{ needs.decide.outputs.credential-name }}
          REASONS: ${{ needs.decide.outputs.reasons }}
          GATE: ${{ needs.decide.outputs.gate }}
          CARRY_WHY: ${{ needs.decide.outputs.why }}
        run: |
          set -euo pipefail
          echo "carry: ${CARRY_WHY:-not checked}" >> "$GITHUB_STEP_SUMMARY"
          # A BLIND with no cause is undiagnosable (td#2373: four BLINDs before anyone could read
          # "Credit balance is too low"). Each transport writes `cause` whenever it writes no verdict.
          if [ -z "$REVIEW_JSON" ] && [ -n "$CAUSE" ]; then REASONS="$REASONS; CAUSE ($CRED_NAME): $CAUSE"; fi
          REVIEW_JSON="$REVIEW_JSON" python3 -m ci_kit.review.verdict --reasons "$REASONS" --body-out body.md
          echo "_gate: ${GATE}_" >> body.md
          cat body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the PR
        if: steps.admit.outputs.defer != 'true' && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [ -f body.md ] || echo "<!-- review-gate -->"$'\n'"review gate: the verdict step did not run" > body.md
          # one sticky comment, found by its marker, so a re-review edits instead of piling up
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
                 -q '.[] | select(.body | startswith("<!-- review-gate -->")) | .id' | tail -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@body.md >/dev/null
          else
            gh pr comment "$PR" --body-file body.md
          fi

      - name: Push a block to ntfy
        if: steps.admit.outputs.defer != 'true' && steps.verdict.outputs.result != 'pass' && !cancelled()
        env:
          NTFY_URL: ${{ secrets.ntfy-url }}
          TITLE: ${{ steps.verdict.outputs.title || 'review gate did not produce a verdict' }}
          URL: ${{ github.event.pull_request.html_url }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.event.repository.name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if [ -z "${NTFY_URL:-}" ]; then echo "::warning::ntfy-url unset; the block was not pushed"; exit 0; fi
          curl -fsS -X POST "$NTFY_URL" -H "Title: $REPO #$PR: $TITLE" \
            -H "Priority: 3" -H "Tags: mag" -H "Click: $URL" \
            --data-binary "$PR_TITLE" >/dev/null \
            || echo "::warning::ntfy push failed"

      - name: Gate
        if: steps.admit.outputs.defer != 'true' && !cancelled()
        env:
          RESULT: ${{ steps.verdict.outputs.result }}
        # INLINE, never a script under $RUNNER_TEMP: in `review` the PR's own tests have run by now
        # and could rewrite any file there; this YAML they cannot reach
        run: |
          case "$RESULT" in
            pass) echo "review gate: pass" ;;
            block) echo "::error::review gate BLOCKED -- see the PR comment"; exit 1 ;;
            *) echo "::error::review gate BLIND ($RESULT) -- the reviewer did not finish looking"; exit 1 ;;
          esac

  defer:
    # A PARKED review (either Admit above). RED on purpose: the PR is not reviewed, so it cannot
    # merge -- nothing is waived. The `queue:parked` label and this job's name say it is the queue's
    # timing, not a finding; pr_heal / redclass read the name and leave it to the scheduler.
    name: review deferred
    needs: [decide, review]
    if: ${{ !cancelled() && (needs.decide.outputs.mode == 'defer' || needs.review.outputs.parked == 'true') }}
    runs-on: ${{ vars.CI_SECURE_RUNNER && fromJSON('["self-hosted","home-secure"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Parked by the PR queue (not a failure of this PR)
        env:
          WHY: ${{ needs.decide.outputs.parked }}
        run: |
          msg="review PARKED by the PR queue -- NOT a failure of this PR, nothing to fix: ${WHY:-the queue head needs the sealed runner}. pr-autoupdate re-runs this review when this PR is the queue head or the pool is free."
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::$msg"
          exit 1

  verdict:
    # THE IN-WORKFLOW AGGREGATE (v1.29.0). The caller's `review gate` judges this whole workflow, and
    # GitHub counts a skipped job as passed: with the model review in its own job, `decide` green +
    # `review` skipped would read as a pass. So: `review` may be skipped ONLY when `decide` said it
    # is not needed (train, skip, finish, defer); in mode `review` it must have run and passed. A
    # parked review fails here as a CONSEQUENCE of `review deferred` (redclass reads it so).
    name: verdict
    needs: [decide, review, defer]
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.CI_SECURE_RUNNER && fromJSON('["self-hosted","home-secure"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: ${{ needs.decide.outputs.mode == 'review' && 'defer' || 'review, defer' }}

  record:
    # What a later run of this PR compares against to carry a verdict (ci_kit.review.carry).
    # A SEPARATE JOB on purpose: the review job runs the PR's own tests, which could rewrite any
    # file on that runner; this runner never checks the PR out. Pass AND block are recorded (the
    # newest record wins, so an older pass cannot outvote a newer block); BLIND records nothing,
    # and neither does a parked run. The hash and origin come from `decide` (secure pool), the
    # result from whichever job produced it: `decide` for a carry, `review` for a full review.
    # continue-on-error: a failure here only means the next run reviews in full, and must never
    # turn the caller's aggregate red.
    name: record verdict
    needs: [decide, review]
    if: >-
      always() && needs.decide.outputs.hash != ''
      && ((needs.decide.outputs.mode == 'finish' && needs.decide.outputs.result == 'pass')
          || (needs.decide.outputs.mode == 'review'
              && (needs.review.outputs.result == 'pass' || needs.review.outputs.result == 'block')))
    # THE SECURE POOL when the caller sets CI_SECURE_RUNNER (2026-11-08): this job holds no
    # secret, but later runs TRUST the artifact it writes to carry a pass, so it never joins the
    # shared socket pool, where a concurrent PR job is root over docker and could rewrite it.
    # The secure pool (home-host VM 111, no docker socket, icc off; home-host docs/CI-RUNNER.md
    # § The secure pool) is the same class as pr-autoupdate's update job. No environment: there
    # is no secret for one to gate. Labels fixed HERE (an ON/OFF switch, never a label list, as
    # in pr-autoupdate.yml). Unset = hosted, as before. vars resolve to the CALLER.
    runs-on: ${{ vars.CI_SECURE_RUNNER && fromJSON('["self-hosted","home-secure"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    continue-on-error: true
    permissions: {}
    steps:
      - name: Write
        env:
          PR: ${{ github.event.pull_request.number }}
          HASH: ${{ needs.decide.outputs.hash }}
          ORIGIN: ${{ needs.decide.outputs.origin }}
          RESULT: ${{ needs.decide.outputs.mode == 'review' && needs.review.outputs.result || needs.decide.outputs.result }}
        run: |
          python3 -c 'import json, os; e = os.environ; print(json.dumps({"pr": int(e["PR"]), "hash": e["HASH"], "head_sha": e["ORIGIN"], "result": e["RESULT"]}))' > verdict.json
          cat verdict.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: review-verdict-${{ github.event.pull_request.number }}
          path: verdict.json
          retention-days: 90
