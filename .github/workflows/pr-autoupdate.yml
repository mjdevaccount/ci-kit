# pr-autoupdate -- merge main into every open PR with auto-merge ARMED (ci-pr-autoupdate).
#
# A repo calls this on each push to main, which is what makes "require branches to be up to
# date" affordable: strict protection with no updater stalls every armed PR BEHIND.
#
#   on:
#     push: { branches: [main] }
#     pull_request_target: { types: [auto_merge_enabled, synchronize] }   # arming (v1.32.0) and a NEW HEAD (v1.45.0) each start a pass
#     workflow_run:                                 # a held PR is reconsidered when its checks finish
#       workflows: [CI, review-gate]                # only workflows that can finish LAST on a PR head
#       types: [completed]
#     workflow_dispatch:
#   concurrency: { group: pr-autoupdate, cancel-in-progress: false }
#   permissions: { contents: read, pull-requests: read, checks: read, statuses: read }
#   jobs:
#     update:
#       # a skipped job takes no runner: main's own CI (the push already ran this sha) and a
#       # cancelled run can change nothing. Decide that HERE, never in a separate "gate" job: on a
#       # single-use pool a gate job costs a whole runner, as much as the pass it was to save.
#       if: >-
#         github.event_name != 'workflow_run'
#         || (github.event.workflow_run.event == 'pull_request'
#             && github.event.workflow_run.conclusion != 'cancelled')
#       uses: mjdevaccount/ci-kit/.github/workflows/pr-autoupdate.yml@v1
#       secrets:
#         token: ${{ secrets.PR_UPDATE_TOKEN }}     # whatever YOUR repo names it
#         ntfy-url: ${{ secrets.NTFY_URL }}         # optional
#
# NO GATE JOB (v1.34.0). trade-data ran a `gate` job ahead of this one to debounce non-last check
# completions: 289 gates on 2026-11-14 (00:00-17:38Z), 142 said go. Each was a single-use
# secure-pool runner (~1.64 runner-min whatever its length), so the 147 no-gos cost more than the
# passes they skipped, and every go paid twice. A pass that runs on a non-last completion is a
# no-op for that PR (pr_queue holds a PR whose required checks are running), and the job-level
# concurrency group collapses a burst to one running + one pending pass, which reads the newest
# state. Also list in `workflow_run` only workflows that can finish last: trade-data's
# `image (PR build)` finished last on 0 of 55 PR heads, so its completions only added runs.
#
# THE MERGE TRAIN (v1.34.0, `train-workflow`): name the caller's merge-train workflow and each pass
# dispatches it when the train would find work (ci_kit/train_kick.py: 2+ candidates by the train's
# own rule, none landing on its own, no train open, no pass queued, and a candidate ready since the
# last pass). The train's cron then needs only an hourly backstop. The token needs Actions: Read
# and write (dispatch); a refused read or dispatch is a red run.
#
# THE TRAIN OWNS THE LANE (v1.35.0, with `queue-hold`): while a live train is open the queue head
# reads `queue/position` pending ("held for merge train #M"), so it cannot land under the train and
# throw its CI away (measured: every unlanded train in a day died "stale: main moved"). Bounded by
# `train-stale-minutes` (set it to the train's `stale-minutes`): a red, BEHIND/DIRTY or older train
# releases the lane and its update hold, named in the summary (`hold: lane RELEASED ...`).
#
# HEAD FAIL-FAST (v1.45.0, `head-fail-fast`, default on; with `scarce-pools`). The queue head is
# the one PR whose CI is about to be paid for, so a head BEHIND main is updated AT ONCE while its
# review is still young (under `preempt-after-minutes` of model time; ci_kit/pr_sched.py
# `review_young`), not when the verdict records: the update's push cancels the run at the stale head
# and the ONE full CI run and the one review happen at a head that can merge. Past that bound it
# waits for the verdict (a review that has cost minutes is carried, not thrown away) -- and THIS
# pass waits with it, in its tail, after `relock=` / `heal=` are written: up to `head-verdict-wait-seconds`
# (240), reading the review every 15 s, and updates the head the moment the verdict is on record.
# The pass that would otherwise do it is a new job behind the gate's tail job and one more runner
# wait (a consumer's #3209, 2026-11-26: verdict on record 06:24:12Z, hand update 06:25:20Z, the
# next pass not startable before 06:26:04Z). The job holds its runner and the `pr-autoupdate`
# concurrency group for that long; a pending pass runs right after. A pass that hands on a relock
# or a heal does NOT wait (a job's outputs reach the job that needs them only when this job ends),
# and a new head pushed during the wait ends it at once. The wait is CLAMPED to 300 s (this job is
# `timeout-minutes: 10`; a longer wait is a job killed mid-wait, not a longer wait).
# WHAT THE WAIT HOLDS: this job's runner (`secure-runner`), for up to the wait. The review gate's
# `verdict` job -- the one the wait is waiting FOR -- runs on that same pool (ci-kit
# review-gate.yml). A caller whose secure pool gives its repo ONE runner blocks its own verdict
# for the whole wait and then updates nothing: with max_runners 1 there, set
# `head-verdict-wait-seconds: 0` (fail-fast itself holds no runner) or give the pool a second
# runner. Nothing here refuses that configuration.
# A NEW HEAD ON AN ARMED PR STARTS NO PASS unless the caller lists `synchronize` beside
# `auto_merge_enabled` above (a consumer, 2026-11-26: a fix push at 04:43:08Z, the next pass at
# 04:53:46Z, the branch updated by hand in between). Guard it to armed same-repo PRs, so an
# unarmed PR's pushes start nothing:
#   if: github.event_name != 'pull_request_target' || (github.event.pull_request.head.repo.full_name == github.repository
#       && (github.event.action != 'synchronize' || github.event.pull_request.auto_merge != null))
#
# THE HEAD HOLDS A SLOT (v1.45.0, with `queue-hold`; ci_kit/pr_queue.py `reserve`). A stale head
# that can land takes one of the `max-in-flight` slots whether this pass updates it or it still
# waits for its verdict. Before, `max-in-flight: 1` updated the head AND the next PR in one pass
# (the same consumer, 05:32Z: `queue: 2/1 in flight`), and under the hold the second run could
# never be the one that merged. Off without the hold, and while a merge train is open.
#
# The secret NAMES are the caller's: this workflow declares `token` and `ntfy-url` and the caller
# maps its own repository secrets onto them (`secrets: inherit` works only if the caller's secrets
# carry these exact names).
#
# A conflicting PR gets the conflict label and ONE ntfy page (if `ntfy-url` is given); the label
# is the dedup. SMART AUTO-MERGE (`rerun-limit`, default 2): an armed PR red only on MACHINERY is
# healed (rerun, or the queue's update when it is behind main); one red on JUDGMENT is named once
# in a PR comment and left for a session (ci_kit/redclass.py, ci_kit/pr_heal.py). Newly labelled PR numbers come back as output `relock` (JSON list) for a caller
# that can relock a lockfile.
#
# THE PR SCHEDULER (`scarce-pools`, v1.29.0; ci_kit/pr_sched.py, policy ci_kit/pr_queue.py): on
# the caller's one-runner pools the queue HEAD (lowest-numbered armed PR) goes first. Each run
# parks (cancels, labels `queue:parked`) a non-head run queued on a pool the head is waiting for,
# or one that started there under `preempt-after-minutes` ago; re-runs parked work in landing
# order (the head's at once); updates a BEHIND head the moment its review verdict is recorded;
# pages a merge of a later PR past an in-flight head; and goes red when the head waited
# `head-stall-minutes` while a non-head job held its pool. ORDER and TIMING only: a parked run is
# re-run in full and every required check still passes at the merging head. Pair it with the
# review gate's `queue-priority: true`. The `token` then needs Actions: Read and write.
#
# RENOVATE JOINS THE QUEUE (v1.32.0, ci_kit/pr_renovate.py). With `max-in-flight` set, each pass
# first ARMS (squash, the GraphQL mutation, pinned to the head it read) every Renovate PR whose body
# says `**Automerge**: Enabled.` -- in a queue repo Renovate itself never arms or merges. Held, never
# armed: Automerge Disabled (the database group, majors, `fails-green`), `autoland-off`, a hand
# `--disable-auto`, a conflict (its rebase box is ticked, so Renovate recreates it on current main).
# A refused arm or tick is a red run. Needs nothing new: the `token` already
# holds Pull requests RW.
#
# ARMING STARTS THE QUEUE (v1.32.0): without `pull_request_target: { types: [auto_merge_enabled] }`
# in the caller's `on:`, a newly armed PR waits for the next push to main or check-workflow run --
# arming is neither. pull_request_target runs the BASE copy of the caller with its secrets; this
# workflow checks out no PR code, so that is safe. Guard the caller's job against a fork's PR:
#   if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
#
# THE HEAL LADDER (`heal`, v1.33.0; ci_kit/pr_ladder.py): a conflict, or a JUDGMENT red, on an
# armed PR is dispatched -- at most once per head, recorded as a PR-comment marker first -- to the
# output `heal` instead of the one comment / one page. The caller runs ci-kit's pr-heal.yml once per
# row (template in that file): tier 1 relocks a lockfile-only conflict (uv, npm, pnpm, NuGet), tier 2
# regenerates the caller's mapped generated files, tier 3 is Claude Code in Actions (the review
# gate's harness, armed non-Renovate-major PRs only, `heal-claude-per-pass` / `-per-pr`), tier 4
# pages ONCE per head. With `heal` on the conflict page moves to tier 4, and a caller's own relock
# job should go (two pushers race). A dispatch with no heal record after `heal-stale-minutes` is
# paged by a later pass. `autoland-off` PRs and the database Renovate group keep the old behaviour.
#
# THE APP TOKEN (v1.37.0; ci_kit/pr_token.py, .github/actions/pr-token): `token-source` (else the
# caller's PR_TOKEN_SOURCE variable, else `pat`) decides whether a GitHub App installation token
# (variable EDGE_BOT_APP_ID, secret EDGE_BOT_PRIVATE_KEY, mapped by the caller like `token`) or the
# PAT acts. Every pass writes `pr-token: source=app|pat ...` to its log and summary. Opt in:
#       secrets:
#         token: ${{ secrets.PR_UPDATE_TOKEN }}
#         EDGE_BOT_PRIVATE_KEY: ${{ secrets.EDGE_BOT_PRIVATE_KEY }}
#   then set the repo variable PR_TOKEN_SOURCE=app (README "The push token" has the three stages).
#
# HELD PRs (`update-held`, default off; ci_kit/pr_held.py): a PR held for review (open, not armed,
# e.g. `autoland-off`) is also kept current with the base -- but only on a `schedule` or
# `workflow_dispatch` pass (add `schedule: [{cron: ...}]` to the caller's `on:`), last, only when no
# armed PR is still on its way to current, and only in the queue's free `max-in-flight` slots. Drafts, forks, conflicts,
# bots' PRs, young heads, any running/failing check and train branches are never touched; every skip
# is named in the summary; a held PR is never labelled or paged, and the held pass never turns the run red.
#
# UNCONFIGURED IS RED: with no `token` the job fails naming it. GITHUB_TOKEN is NOT a fallback --
# a push made with it fires no workflow, so every updated PR would wait on checks that never
# start, which looks exactly like "CI pending".
name: pr-autoupdate

on:
  workflow_call:
    inputs:
      review-workflow:
        description: workflow file whose queued/running run on a PR's branch defers its update ('' = none)
        type: string
        default: ""
      tracker:
        description: issue number whose row for a PR a conflict page quotes (0 = none)
        type: number
        default: 0
      relock:
        description: the caller relocks lockfile-only conflicts from the `relock` output
        type: boolean
        default: false
      label:
        description: the conflict label (the page dedup)
        type: string
        default: conflict
      max-in-flight:
        description: >-
          armed PRs tested against current main at once, lowest PR number first (0 = update every armed
          PR). Under strict protection only one PR merges per main sha, so 1 wastes no CI run; call
          this workflow on `workflow_run` of your check workflows too, or a held PR waits for the next
          push to main (ci_kit/pr_queue.py)
        type: number
        default: 0
      required-checks:
        description: comma-separated check names the queue reads (your branch protection's required contexts; '' = every check)
        type: string
        default: ""
      rerun-limit:
        description: >-
          smart auto-merge (ci_kit/pr_heal.py): a red on an armed PR that is MACHINERY (a lost runner,
          a cancelled run, a setup step's network error) is rerun at most this many times per head;
          a JUDGMENT red gets one PR comment and is never rerun. 0 = off. A rerun needs the `token`
          PAT to hold Actions: Read and write -- refused, the run is red naming that grant
        type: number
        default: 2
      scarce-pools:
        description: >-
          the PR scheduler (ci_kit/pr_sched.py): a JSON object of the caller's scarce runner pool
          labels -> capacity, e.g. {"home-sealed": 1, "home-heavy": 1}. '' = off (parked work is
          still re-run). Needs the `token` PAT to hold Actions: Read and write. With it, head-fail-fast's
          verdict wait (head-verdict-wait-seconds) holds THIS job's secure-runner for up to the wait while the
          review gate's `verdict` job needs a runner from the same pool: a pool that gives this repo ONE
          runner blocks its own verdict for the whole wait -- set head-verdict-wait-seconds to 0 there
        type: string
        default: ""
      preempt-after-minutes:
        description: a non-head job on a scarce pool is parked for a waiting head only if it started less than this ago
        type: number
        default: 3
      head-stall-minutes:
        description: the queue head waiting this long on a pool a non-head job holds turns the run red (queue-head-starved); twice this, the next parked non-head is PARKED STARVED (named every pass and paged once per head, the run stays green, v1.35.0)
        type: number
        default: 15
      train-workflow:
        description: >-
          the caller's merge-train workflow file (e.g. merge-train.yml): each pass dispatches it when the train
          would find work (ci_kit/train_kick.py), so its cron can be an hourly backstop. '' = off. Needs the
          token's Actions: Read and write
        type: string
        default: ""
      train-min-batch:
        description: the train's own min-batch (dispatch only with at least this many candidates)
        type: number
        default: 2
      train-stale-minutes:
        description: >-
          the merge train's own `stale-minutes` (v1.35.0): with `queue-hold`, an open merge train holds the queue
          head pending (so main cannot move under the train) for at most this long; a red, BEHIND or older train
          releases it, and the pass summary says so (ci_kit/pr_hold.py live_train)
        type: number
        default: 90
      cancel-doomed-runs:
        description: >-
          cancel the queued/running `pull_request` runs at a head that cannot merge and whose result
          nothing reads -- the head the queue just replaced; an armed DIRTY head on a strict base; an armed
          BEHIND head on a strict base in a repo with NO merge train (ci_kit/doomed_runs.py; never the
          review workflow, never a non-PR event, never an unarmed PR). Needs Actions RW to act and
          Administration read to see `strict`; without either it says so and cancels nothing
        type: boolean
        default: true
      queue-hold:
        description: >-
          the QUEUE HOLD (ci_kit/pr_hold.py, v1.30.0): post commit status `queue/position` -- success on the queue
          head (and a merge train), pending on every other open PR -- so an out-of-turn auto-merge cannot land once
          branch protection requires `queue/position`. Needs the token's Commit statuses read+write. Turn this on
          FIRST and require the context only after a pass has posted (protection first blocks every merge).
          Keep `queue/position` OUT of `required-checks`: the queue must not read a waiting PR as running.
        type: boolean
        default: false
      heal:
        description: >-
          the HEAL LADDER (ci_kit/pr_ladder.py, v1.33.0): conflicts and judgment reds on armed PRs go to
          output `heal` (one row per dispatch, at most one per head) for the caller's pr-heal.yml call,
          instead of a comment / a page. Off = exactly the old behaviour
        type: boolean
        default: false
      heal-claude-per-pass:
        description: tier-3 (Claude) dispatches per pass; a PR over it waits for the next pass (0 = tier 3 off)
        type: number
        default: 1
      heal-claude-per-pr:
        description: tier-3 dispatches per PR, across all its heads
        type: number
        default: 2
      heal-per-pr:
        description: heal dispatches per PR, across all its heads (a push-red-push loop ends in a page)
        type: number
        default: 6
      heal-stale-minutes:
        description: a dispatch with no heal record after this long is paged by the next pass (default = every pr-heal job timeout, 95, plus 40 for the sealed-runner wait; ci_kit/pr_ladder.py STALE_MIN)
        type: number
        default: 135
      base-retry-cap:
        description: base-driven retries (since the PR's last own commit) of an armed PR held red + BEHIND on a check MAIN went red -> green on (ci_kit/pr_baseretry.py; once per head, after every green PR; at the cap a marker comment + a red pass; 0 = off; DEFAULT 1 since v1.43.0, measured on edge-host 11-14..11-23 -- 2 retries, both PRs merged, none spent; at most 30, a larger value is refused)
        type: number
        default: 1
      base-retry-max-per-pass:
        description: base-retry candidates whose main runs are read per pass, lowest PR number first (the rest are named in the summary and wait for the next pass); 1..100
        type: number
        default: 3
      token-source:
        description: >-
          WHICH TOKEN ACTS (v1.37.0, ci_kit/pr_token.py): pat | app | app-required ('' = the caller repo's
          PR_TOKEN_SOURCE variable, else pat). app mints a GitHub App token (variable EDGE_BOT_APP_ID, secret
          EDGE_BOT_PRIVATE_KEY) and falls back to `token` only when the App is not configured; app-required never
          uses `token`. Prefer the variable: a rollback is then a variable delete, no stanza edit
        type: string
        default: ""
      base-retry-bot-authors:
        description: comma-separated EXACT author logins (as GraphQL reports them, e.g. Renovate's app is `renovate`; the author must also be a Bot account) whose red + BEHIND PRs get the NO-AUTHOR base retry -- main green on the failing checks and moved since the red run, no red-at-base evidence -- under the same markers and cap ('' = off; DEFAULT `renovate` since v1.43.0 -- a Renovate PR red on a stale base has no author to push the fix; needs base-retry-cap > 0)
        type: string
        default: 'renovate'
      app-client-id:
        description: the App's client id, with the app-private-key secret ('' = deprecated EDGE_BOT_APP_ID) -- README "Generic names"
        type: string
        default: ""
      secure-runner:
        description: the secure pool's runs-on, a JSON label list ('' = the CI_SECURE_RUNNER switch, else hosted) -- README "Generic names"
        type: string
        default: ""
      head-fail-fast:
        description: >-
          HEAD FAIL-FAST (v1.45.0, ci_kit/pr_sched.py review_young): with scarce-pools, a queue head BEHIND
          the base is updated at once while its review has spent under preempt-after-minutes of model time,
          so its one full CI run is at a head that can merge; false = wait for the verdict, as before v1.45.0.
          Past that bound the pass waits for the verdict on its own runner (head-verdict-wait-seconds), which
          the review gate's `verdict` job shares: see that input before enabling this on a one-runner secure pool
        type: boolean
        default: true
      head-verdict-wait-seconds:
        description: >-
          with head-fail-fast: seconds the pass's tail waits for a BEHIND queue head past the young bound to
          record its verdict, then updates it in the same job (ci_kit/pr_autoupdate.py _await_head); 0 = off.
          CLAMPED to 300 (a WARNING says so): this job is timeout-minutes 10, a longer wait is a killed job.
          The wait HOLDS this job's secure-runner, and the `verdict` job it waits for runs on the same pool
          (ci-kit review-gate.yml): where that pool gives the repo ONE runner the wait blocks its own verdict
          for its whole length and updates nothing -- set 0 there, or give the pool a second runner
        type: number
        default: 240
      update-held:
        description: also merge the base into HELD PRs (open, not armed, BEHIND, mergeable, no check running or failing, not a bot's) on schedule / workflow_dispatch passes only, last, once no armed PR is on its way to current, in the queue's free slots (ci_kit/pr_held.py)
        type: boolean
        default: false
    secrets:
      token:
        description: fine-grained PAT with contents, pull requests and workflows RW, actions read (RW with scarce-pools -- the scheduler cancels and re-runs --, with train-workflow, which dispatches, and with cancel-doomed-runs), administration read (cancel-doomed-runs reads whether the base is strict), commit statuses RW with queue-hold, on the caller repo. Not required since v1.37.0 (token-source app-required never reads it); empty while the PAT acts is still a red run
        required: false
      app-private-key:
        description: the App's private key, with the app-client-id input -- README "Generic names"
        required: false
      EDGE_BOT_PRIVATE_KEY:
        description: DEPRECATED alias of app-private-key -- README "Generic names"
        required: false
      ntfy-url:
        description: an ntfy topic URL to page on a NEW conflict ('' = no page)
        required: false
    outputs:
      relock:
        description: JSON list of PR numbers newly labelled as conflicting by this run
        value: ${{ jobs.update.outputs.relock }}
      heal:
        description: JSON list of heal-ladder dispatches, {pr, head, mode, claude, checks, runs} (pr-heal.yml's inputs)
        value: ${{ jobs.update.outputs.heal }}

# The open-PR list reads `statusCheckRollup` with GITHUB_TOKEN (CI_KIT_READ_TOKEN below): GitHub
# refuses a fine-grained PAT the check runs inside it (2026-10-24, every caller with an open PR).
# A caller must GRANT these reads -- a called workflow can only narrow the caller's permissions.
permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  update:
    name: update armed PRs
    # It holds the token (push to every armed PR), so it NEVER joins the shared socket pool
    # (CI_RUNNER: there a job is root over docker and can read a concurrent job's secrets). It may
    # run on the caller's SECRET pool -- home-host VM 111, no docker socket in any runner, icc off
    # (home-host docs/CI-RUNNER.md § The secure pool) -- when the caller sets CI_SECURE_RUNNER, and
    # then runs in the caller's `ci-secure` environment, whose default-branch-only policy is the
    # gate: the token job cannot run from any other ref. The token itself is STILL the one passed
    # in `secrets:` -- an environment secret does NOT override a declared workflow_call secret
    # (measured 2026-11-07, claude-plugins run 42337000304: env secret set, job deployed to
    # ci-secure, token empty), so the environment holds no copy. Without the variable: hosted, no
    # environment, the passed secret -- exactly as before. vars resolve to the CALLER.
    # CI_SECURE_RUNNER is an ON/OFF switch, never a label list: the labels are fixed HERE, so a
    # typo in a repo variable cannot send this token job to a socket runner (home-host review
    # 2026-11-07, finding 5). Any non-empty value turns it on.
    runs-on: ${{ inputs.secure-runner && fromJSON(inputs.secure-runner) || vars.CI_SECURE_RUNNER && fromJSON('["self-hosted","home-secure"]') || 'ubuntu-latest' }}
    environment: ${{ (inputs.secure-runner || vars.CI_SECURE_RUNNER) && 'ci-secure' || '' }}
    timeout-minutes: 10
    outputs:
      relock: ${{ steps.update.outputs.relock }}
      heal: ${{ steps.update.outputs.heal }}
    env:
      CI_KIT_READ_TOKEN: ${{ github.token }}
      NTFY_URL: ${{ secrets.ntfy-url }}
      # check names carry spaces ("unit tests"), and the action word-splits `args`: an env var, not a flag
      CI_KIT_REQUIRED_CHECKS: ${{ inputs.required-checks }}
      # JSON: braces and quotes, so an env var too. The push's before/after name an out-of-queue merge.
      # The scheduler's two FLAGS are passed only with scarce-pools set: ci-kit's own
      # pr-autoupdate-self runs THIS file from main against the @v1 tool, which lags a merge by the
      # tag-version + major-tag run, and an older tool refuses a flag it does not know.
      CI_KIT_SCARCE_POOLS: ${{ inputs.scarce-pools }}
      # an env var, never a flag: an older @v1 tool would refuse a flag it does not know
      CI_KIT_QUEUE_HOLD: ${{ inputs.queue-hold }}
      # env vars, never flags (the older-@v1-tool reason above)
      CI_KIT_TRAIN_WORKFLOW: ${{ inputs.train-workflow }}
      CI_KIT_TRAIN_MIN_BATCH: ${{ inputs.train-min-batch }}
      CI_KIT_TRAIN_STALE_MIN: ${{ inputs.train-stale-minutes }}
      CI_KIT_CANCEL_DOOMED: ${{ inputs.cancel-doomed-runs }}
      # the heal ladder: env vars, never flags (an older @v1 tool refuses a flag it does not know)
      CI_KIT_HEAL: ${{ inputs.heal }}
      CI_KIT_HEAL_CLAUDE_PER_PASS: ${{ inputs.heal-claude-per-pass }}
      CI_KIT_HEAL_CLAUDE_PER_PR: ${{ inputs.heal-claude-per-pr }}
      CI_KIT_HEAL_PER_PR: ${{ inputs.heal-per-pr }}
      CI_KIT_HEAL_STALE_MIN: ${{ inputs.heal-stale-minutes }}
      # an env var, never a flag (the older-@v1-tool reason above)
      CI_KIT_BASE_RETRY_CAP: ${{ inputs.base-retry-cap }}
      # the DEFAULT list (renovate) is passed only where it can act (cap > 0 and a queue): a caller that
      # turns retry off with `base-retry-cap: 0` alone, or runs no queue, is quiet. A list the caller SET
      # is always passed, so ci_kit.pr_autoupdate.base_retry_warning still names one that cannot act.
      CI_KIT_BASE_RETRY_BOT_AUTHORS: ${{ (inputs.base-retry-bot-authors != 'renovate' || (inputs.base-retry-cap > 0 && inputs.max-in-flight > 0)) && inputs.base-retry-bot-authors || '' }}
      CI_KIT_BASE_RETRY_MAX_PER_PASS: ${{ inputs.base-retry-max-per-pass }}
      CI_KIT_UPDATE_HELD: ${{ inputs.update-held }}
      # an env var, never a flag (the older-@v1-tool reason above)
      CI_KIT_HEAD_FAIL_FAST: ${{ inputs.head-fail-fast }}
      CI_KIT_HEAD_VERDICT_WAIT_S: ${{ inputs.head-verdict-wait-seconds }}
      CI_KIT_EVENT: ${{ github.event_name }}
      # a PUSH's previous sha only. `github.event.before` exists on `pull_request_target: synchronize`
      # too, where it is the PR's PREVIOUS HEAD: read as main's previous sha it would let the
      # out-of-queue check compare the queue head against its own old head (review of v1.45.0, R1)
      CI_KIT_BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
      CI_KIT_SHA: ${{ github.sha }}
    steps:
      # THE TOKEN (v1.37.0): the App or the PAT, staged by token-source; an empty one is still RED
      # (the record line `pr-token: source=...` names which acted, ci_kit/pr_token.py)
      - name: Push token (App or PAT)
        id: token
        uses: mjdevaccount/ci-kit/.github/actions/pr-token@v1
        with: {scope: update, mode: "${{ inputs.token-source || vars.PR_TOKEN_SOURCE }}", pat: "${{ secrets.token }}",
               client-id: "${{ inputs.app-client-id }}", private-key: "${{ secrets.app-private-key }}",
               deprecated-client-id: "${{ vars.EDGE_BOT_APP_ID }}", deprecated-private-key: "${{ secrets.EDGE_BOT_PRIVATE_KEY }}"}
      - name: Update
        id: update
        uses: mjdevaccount/ci-kit@v1
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          CI_KIT_TOKEN_LOGIN: ${{ steps.token.outputs.login }}
          CI_KIT_TRUSTED_LOGINS: ${{ steps.token.outputs.trusted }}
        with:
          tool: ci-pr-autoupdate
          args: >-
            --repo ${{ github.repository }}
            --tracker ${{ inputs.tracker }}
            --label ${{ inputs.label }}
            --max-in-flight ${{ inputs.max-in-flight }}
            --rerun-limit ${{ inputs.rerun-limit }}
            ${{ inputs.scarce-pools != '' && format('--preempt-after-min {0} --head-stall-min {1}', inputs.preempt-after-minutes, inputs.head-stall-minutes) || '' }}
            ${{ inputs.review-workflow != '' && format('--review-workflow {0}', inputs.review-workflow) || '' }}
            ${{ inputs.relock && '--relock' || '' }}
