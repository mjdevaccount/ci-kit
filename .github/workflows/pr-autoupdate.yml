# pr-autoupdate -- merge main into every open PR with auto-merge ARMED (ci-pr-autoupdate).
#
# A repo calls this on each push to main, which is what makes "require branches to be up to
# date" affordable: strict protection with no updater stalls every armed PR BEHIND.
#
#   on:
#     push: { branches: [main] }
#     workflow_run:                                 # a held PR is reconsidered when its checks finish
#       workflows: [CI, review-gate]                # only workflows that can finish LAST on a PR head
#       types: [completed]
#     workflow_dispatch:
#   concurrency: { group: pr-autoupdate, cancel-in-progress: false }
#   permissions: { contents: read, pull-requests: read, checks: read, statuses: read }
#   jobs:
#     update:
#       # a skipped job takes no runner: main's own CI (the push already ran this sha) and a
#       # cancelled run can change nothing. Decide that HERE, never in a separate "gate" job: on a
#       # single-use pool a gate job costs a whole runner, as much as the pass it was to save.
#       if: >-
#         github.event_name != 'workflow_run'
#         || (github.event.workflow_run.event == 'pull_request'
#             && github.event.workflow_run.conclusion != 'cancelled')
#       uses: mjdevaccount/ci-kit/.github/workflows/pr-autoupdate.yml@v1
#       secrets:
#         token: ${{ secrets.PR_UPDATE_TOKEN }}     # whatever YOUR repo names it
#         ntfy-url: ${{ secrets.NTFY_URL }}         # optional
#
# NO GATE JOB (v1.32.0). trade-data ran a `gate` job ahead of this one to debounce non-last check
# completions: 289 gates on 2026-11-14 (00:00-17:38Z), 142 said go. Each was a single-use
# secure-pool runner (~1.64 runner-min whatever its length), so the 147 no-gos cost more than the
# passes they skipped, and every go paid twice. A pass that runs on a non-last completion is a
# no-op for that PR (pr_queue holds a PR whose required checks are running), and the job-level
# concurrency group collapses a burst to one running + one pending pass, which reads the newest
# state. Also list in `workflow_run` only workflows that can finish last: trade-data's
# `image (PR build)` finished last on 0 of 55 PR heads, so its completions only added runs.
#
# THE MERGE TRAIN (v1.32.0, `train-workflow`): name the caller's merge-train workflow and each pass
# dispatches it when the train would find work (ci_kit/train_kick.py: 2+ candidates by the train's
# own rule, none landing on its own, no train open, no pass queued, and a candidate ready since the
# last pass). The train's cron then needs only an hourly backstop. The token needs Actions: Read
# and write (dispatch); a refused read or dispatch is a red run.
#
# The secret NAMES are the caller's: this workflow declares `token` and `ntfy-url` and the caller
# maps its own repository secrets onto them (`secrets: inherit` works only if the caller's secrets
# carry these exact names).
#
# A conflicting PR gets the conflict label and ONE ntfy page (if `ntfy-url` is given); the label
# is the dedup. SMART AUTO-MERGE (`rerun-limit`, default 2): an armed PR red only on MACHINERY is
# healed (rerun, or the queue's update when it is behind main); one red on JUDGMENT is named once
# in a PR comment and left for a session (ci_kit/redclass.py, ci_kit/pr_heal.py). Newly labelled PR numbers come back as output `relock` (JSON list) for a caller
# that can relock a lockfile.
#
# THE PR SCHEDULER (`scarce-pools`, v1.29.0; ci_kit/pr_sched.py, policy ci_kit/pr_queue.py): on
# the caller's one-runner pools the queue HEAD (lowest-numbered armed PR) goes first. Each run
# parks (cancels, labels `queue:parked`) a non-head run queued on a pool the head is waiting for,
# or one that started there under `preempt-after-minutes` ago; re-runs parked work in landing
# order (the head's at once); updates a BEHIND head the moment its review verdict is recorded;
# pages a merge of a later PR past an in-flight head; and goes red when the head waited
# `head-stall-minutes` while a non-head job held its pool. ORDER and TIMING only: a parked run is
# re-run in full and every required check still passes at the merging head. Pair it with the
# review gate's `queue-priority: true`. The `token` then needs Actions: Read and write.
#
# UNCONFIGURED IS RED: with no `token` the job fails naming it. GITHUB_TOKEN is NOT a fallback --
# a push made with it fires no workflow, so every updated PR would wait on checks that never
# start, which looks exactly like "CI pending".
name: pr-autoupdate

on:
  workflow_call:
    inputs:
      review-workflow:
        description: workflow file whose queued/running run on a PR's branch defers its update ('' = none)
        type: string
        default: ""
      tracker:
        description: issue number whose row for a PR a conflict page quotes (0 = none)
        type: number
        default: 0
      relock:
        description: the caller relocks lockfile-only conflicts from the `relock` output
        type: boolean
        default: false
      label:
        description: the conflict label (the page dedup)
        type: string
        default: conflict
      max-in-flight:
        description: >-
          armed PRs tested against current main at once, lowest PR number first (0 = update every armed
          PR). Under strict protection only one PR merges per main sha, so 1 wastes no CI run; call
          this workflow on `workflow_run` of your check workflows too, or a held PR waits for the next
          push to main (ci_kit/pr_queue.py)
        type: number
        default: 0
      required-checks:
        description: comma-separated check names the queue reads (your branch protection's required contexts; '' = every check)
        type: string
        default: ""
      rerun-limit:
        description: >-
          smart auto-merge (ci_kit/pr_heal.py): a red on an armed PR that is MACHINERY (a lost runner,
          a cancelled run, a setup step's network error) is rerun at most this many times per head;
          a JUDGMENT red gets one PR comment and is never rerun. 0 = off. A rerun needs the `token`
          PAT to hold Actions: Read and write -- refused, the run is red naming that grant
        type: number
        default: 2
      scarce-pools:
        description: >-
          the PR scheduler (ci_kit/pr_sched.py): a JSON object of the caller's scarce runner pool
          labels -> capacity, e.g. {"home-sealed": 1, "home-heavy": 1}. '' = off (parked work is
          still re-run). Needs the `token` PAT to hold Actions: Read and write
        type: string
        default: ""
      preempt-after-minutes:
        description: a non-head job on a scarce pool is parked for a waiting head only if it started less than this ago
        type: number
        default: 3
      head-stall-minutes:
        description: the queue head waiting this long on a pool a non-head job holds turns the run red (queue-head-starved)
        type: number
        default: 15
      train-workflow:
        description: >-
          the caller's merge-train workflow file (e.g. merge-train.yml): each pass dispatches it when the train
          would find work (ci_kit/train_kick.py), so its cron can be an hourly backstop. '' = off. Needs the
          token's Actions: Read and write
        type: string
        default: ""
      train-min-batch:
        description: the train's own min-batch (dispatch only with at least this many candidates)
        type: number
        default: 2
      cancel-doomed-runs:
        description: >-
          cancel the queued/running `pull_request` runs at an armed PR head that cannot merge -- BEHIND
          or DIRTY on a strict-protected base, or the head the queue just replaced (ci_kit/doomed_runs.py;
          never the review workflow, never a non-PR event, never an unarmed PR). Needs Actions RW to act
          and Administration read to see `strict`; without either it says so and cancels nothing
        type: boolean
        default: true
      queue-hold:
        description: >-
          the QUEUE HOLD (ci_kit/pr_hold.py, v1.30.0): post commit status `queue/position` -- success on the queue
          head (and a merge train), pending on every other open PR -- so an out-of-turn auto-merge cannot land once
          branch protection requires `queue/position`. Needs the token's Commit statuses read+write. Turn this on
          FIRST and require the context only after a pass has posted (protection first blocks every merge).
          Keep `queue/position` OUT of `required-checks`: the queue must not read a waiting PR as running.
        type: boolean
        default: false
    secrets:
      token:
        description: fine-grained PAT with contents, pull requests and workflows RW, actions read (RW with scarce-pools -- the scheduler cancels and re-runs --, with train-workflow, which dispatches, and with cancel-doomed-runs), administration read (cancel-doomed-runs reads whether the base is strict), commit statuses RW with queue-hold, on the caller repo
        required: true
      ntfy-url:
        description: an ntfy topic URL to page on a NEW conflict ('' = no page)
        required: false
    outputs:
      relock:
        description: JSON list of PR numbers newly labelled as conflicting by this run
        value: ${{ jobs.update.outputs.relock }}

# The open-PR list reads `statusCheckRollup` with GITHUB_TOKEN (CI_KIT_READ_TOKEN below): GitHub
# refuses a fine-grained PAT the check runs inside it (2026-10-24, every caller with an open PR).
# A caller must GRANT these reads -- a called workflow can only narrow the caller's permissions.
permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  update:
    name: update armed PRs
    # It holds the token (push to every armed PR), so it NEVER joins the shared socket pool
    # (CI_RUNNER: there a job is root over docker and can read a concurrent job's secrets). It may
    # run on the caller's SECRET pool -- home-host VM 111, no docker socket in any runner, icc off
    # (home-host docs/CI-RUNNER.md § The secure pool) -- when the caller sets CI_SECURE_RUNNER, and
    # then runs in the caller's `ci-secure` environment, whose default-branch-only policy is the
    # gate: the token job cannot run from any other ref. The token itself is STILL the one passed
    # in `secrets:` -- an environment secret does NOT override a declared workflow_call secret
    # (measured 2026-11-07, claude-plugins run 42337000304: env secret set, job deployed to
    # ci-secure, token empty), so the environment holds no copy. Without the variable: hosted, no
    # environment, the passed secret -- exactly as before. vars resolve to the CALLER.
    # CI_SECURE_RUNNER is an ON/OFF switch, never a label list: the labels are fixed HERE, so a
    # typo in a repo variable cannot send this token job to a socket runner (home-host review
    # 2026-11-07, finding 5). Any non-empty value turns it on.
    runs-on: ${{ vars.CI_SECURE_RUNNER && fromJSON('["self-hosted","home-secure"]') || 'ubuntu-latest' }}
    environment: ${{ vars.CI_SECURE_RUNNER && 'ci-secure' || '' }}
    timeout-minutes: 10
    outputs:
      relock: ${{ steps.update.outputs.relock }}
    env:
      GH_TOKEN: ${{ secrets.token }}
      CI_KIT_READ_TOKEN: ${{ github.token }}
      NTFY_URL: ${{ secrets.ntfy-url }}
      # check names carry spaces ("unit tests"), and the action word-splits `args`: an env var, not a flag
      CI_KIT_REQUIRED_CHECKS: ${{ inputs.required-checks }}
      # JSON: braces and quotes, so an env var too. The push's before/after name an out-of-queue merge.
      # The scheduler's two FLAGS are passed only with scarce-pools set: ci-kit's own
      # pr-autoupdate-self runs THIS file from main against the @v1 tool, which lags a merge by the
      # tag-version + major-tag run, and an older tool refuses a flag it does not know.
      CI_KIT_SCARCE_POOLS: ${{ inputs.scarce-pools }}
      # an env var, never a flag: an older @v1 tool would refuse a flag it does not know
      CI_KIT_QUEUE_HOLD: ${{ inputs.queue-hold }}
      # env vars, never flags (the older-@v1-tool reason above)
      CI_KIT_TRAIN_WORKFLOW: ${{ inputs.train-workflow }}
      CI_KIT_TRAIN_MIN_BATCH: ${{ inputs.train-min-batch }}
      CI_KIT_CANCEL_DOOMED: ${{ inputs.cancel-doomed-runs }}
      CI_KIT_EVENT: ${{ github.event_name }}
      CI_KIT_BEFORE: ${{ github.event.before }}
      CI_KIT_SHA: ${{ github.sha }}
    steps:
      - name: Refuse to run unconfigured
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::secret 'token' is empty for $GITHUB_REPOSITORY: armed PRs are NOT being updated. Map a fine-grained token (contents, pull requests, workflows: read+write; actions: read, read+write with scarce-pools) onto 'token' in the workflow_call secrets."
            exit 1
          fi
      - name: Update
        id: update
        uses: mjdevaccount/ci-kit@v1
        with:
          tool: ci-pr-autoupdate
          args: >-
            --repo ${{ github.repository }}
            --tracker ${{ inputs.tracker }}
            --label ${{ inputs.label }}
            --max-in-flight ${{ inputs.max-in-flight }}
            --rerun-limit ${{ inputs.rerun-limit }}
            ${{ inputs.scarce-pools != '' && format('--preempt-after-min {0} --head-stall-min {1}', inputs.preempt-after-minutes, inputs.head-stall-minutes) || '' }}
            ${{ inputs.review-workflow != '' && format('--review-workflow {0}', inputs.review-workflow) || '' }}
            ${{ inputs.relock && '--relock' || '' }}
