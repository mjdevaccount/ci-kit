# gitleaks -- a secret scan, in the three shapes repos actually run.
#
#   jobs:
#     gitleaks:
#       name: gitleaks (secret scan)
#       permissions: { contents: read }
#       uses: mjdevaccount/ci-kit/.github/workflows/gitleaks.yml@v1
#       with: { mode: tree }
#
# Reports as "<caller job name> / scan". The modes are NOT merged into one because repos differ
# on purpose:
#   tree     WORKING TREE only (--no-git). For a history that carries known-leaked items
#            pending rotation/purge, where a full-history scan would drown real signal.
#   history  FULL history OF HEAD'S ANCESTRY, optionally with a custom config and a
#            .gitleaksignore that baselines a known item by fingerprint, loud on anything new.
#            HEAD's ancestry, never `--all` (2026-10-31): gitleaks' default log is
#            `--full-history --all`, and a fetch-depth-0 checkout carries EVERY remote branch, so a
#            fixture on one open PR branch failed every other PR in the repo (edge-host#545 red on
#            edge-host#544's bats stub) and the red PR's author could not fix it. A PR run's HEAD is
#            the merge ref = base + the PR's own commits: exactly what that PR can answer for. The
#            same lesson as the doc gate's edge-ci#33.
#   range    the scope gitleaks-action had: a PR's own commits, a push's range, every ref on any
#            other event (dispatch, schedule). `action` is the old name and still accepted.
# Zero commits scanned is exit 2 in history/range, never a pass: a bad rev spec must not go green.
# Every mode fails the job on a finding. None of them may be baselined away: rotate the secret.
#
# ONE SCANNER (2026-11-08): every mode is ci-kit's `ci-gitleaks`, gitleaks pinned by version AND
# sha256 through release_bin (cached, retried, the REST asset fallback). Before, tree/history ran a
# digest-pinned docker image and `action` ran gitleaks/gitleaks-action@v3, which downloaded its
# tarball from github.com releases/download on every run with no retry: that path 504'd for over
# an hour and every PR running it went red WITHOUT SCANNING (trade-data #2880-2884). Same gitleaks
# (8.30.1) as the image was, so findings and fingerprints are unchanged. No docker socket and no
# third-party JS holding the token, so `range` joins tree/history on the caller's home pool.
name: gitleaks

on:
  workflow_call:
    inputs:
      mode:
        description: tree | history | range (action = range, the old name)
        type: string
        default: tree
      config:
        description: gitleaks config path relative to the repo root ('' = the built-in ruleset)
        type: string
        default: ""
      ignore-path:
        description: "an extra .gitleaksignore (file, or a folder holding one) relative to the repo root. '' does NOT mean no baseline: gitleaks always loads ./.gitleaksignore and <source>/.gitleaksignore when present, and ci-gitleaks judges every file it loads -- a dead entry (absolute /repo/ path, malformed fingerprint) or a missing path given here is exit 2"
        type: string
        default: ""
      image:
        description: IGNORED since v1.16.0 (no docker; the gitleaks pin is ci_kit/gitleaks.py). Kept so an old caller does not fail on an unknown input
        type: string
        default: ""

permissions:
  contents: read

jobs:
  scan:
    name: scan
    # On the CALLER's home pool when its CI_RUNNER variable is set (vars resolve to the calling
    # repo), else hosted. It holds no secret: github.token is contents:read, the grant every home
    # job's checkout already gets, and only release_bin's API fallback reads it (ci-kit action.yml).
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LIGHT || vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Refuse an unknown mode
        id: mode
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            tree|history|range) echo "mode=$MODE" >> "$GITHUB_OUTPUT" ;;
            action) echo "mode=range" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::gitleaks mode '$MODE' is not tree|history|range: NOTHING WAS SCANNED"; exit 2 ;;
          esac
      - uses: actions/checkout@v7
        with:
          # full history for history/range: a leak buried two commits deep must still fail
          fetch-depth: ${{ steps.mode.outputs.mode == 'tree' && 1 || 0 }}
      - name: Assemble ci-gitleaks args
        id: args
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          CONFIG: ${{ inputs.config }}
          IGNORE: ${{ inputs.ignore-path }}
        run: |
          # the action word-splits `args` with no quoting, so a path with whitespace is refused here
          for p in "$CONFIG" "$IGNORE"; do
            case "$p" in *[[:space:]]*) echo "::error::gitleaks path '$p' contains whitespace: NOTHING WAS SCANNED"; exit 2 ;; esac
          done
          a="--mode $MODE"
          [ -n "$CONFIG" ] && a="$a --config $CONFIG"
          [ -n "$IGNORE" ] && a="$a --ignore-path $IGNORE"
          echo "args=$a" >> "$GITHUB_OUTPUT"
      - name: gitleaks (${{ steps.mode.outputs.mode }})
        uses: mjdevaccount/ci-kit@v1
        with:
          tool: ci-gitleaks
          args: ${{ steps.args.outputs.args }}
