# secret-argv -- no secret expanded into a host-side argv (ci-secret-argv-lint).
#
#   jobs:
#     secret-argv:
#       uses: mjdevaccount/ci-kit/.github/workflows/secret-argv.yml@v1
#
# Reports as "<caller job> / lint". For the repos whose shell or verify probes reach into
# containers. Born 2026-10-20: an API key in plain text in `docker events`, from
# `docker exec <c> curl -H "X-API-Key: $K"` expanded on the host.
name: secret-argv

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          runs-on as a JSON label list ('' = the caller repo's CI_RUNNER variable, else
          ubuntu-latest). Holds no secret, so it may join a shared pool; see doc-refs.yml.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ${{ inputs.runner != '' && fromJSON(inputs.runner) || vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: no secret expanded into a host-side docker exec / curl / ssh argv
        uses: mjdevaccount/ci-kit@v1
        with:
          tool: ci-secret-argv-lint
      - name: secret-argv lint selftest
        uses: mjdevaccount/ci-kit@v1
        with:
          tool: ci-secret-argv-lint
          args: --selftest
