# declared-literal -- a literal that must live in one declared file appears nowhere else
# (ci-declared-literal). The kit ships NO policy: the caller's args file holds every rule.
#
#   jobs:
#     literals:
#       uses: mjdevaccount/ci-kit/.github/workflows/declared-literal.yml@v1
#       with:
#         args: "@ci/literals.args"
#
#   # ci/literals.args -- one argument per line; blank and `#` lines are notes, never directly
#   # after a flag that takes a value (exit 2); the file resolves against the checkout root
#   --rule
#   docs-net
#   --pattern=\b192\.0\.2\.\d{1,3}\b
#   --example=GATEWAY=192.0.2.1
#   --declared
#   .env.example
#   --message
#   Read it from .env (the variable named in .env.example); a comment line may keep it for history.
#   --exempt-suffix
#   .md
#
# Reports as "<caller job> / lint". A regex cannot ride in `args` itself (the action word-splits
# it and forbids quotes), so the policy is a committed file -- CI and a workstation run read the
# same rules. With no rule the gate is exit 2, never a pass over nothing; every rule carries an
# --example it must flag, so a pattern that cannot fire is exit 2 too.
name: declared-literal

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          JSON runs-on labels; '' = the caller's lane (doc-refs.yml's runner input says which).
        type: string
        default: ""
      args:
        description: the caller's policy, normally `@<path to args file>`; plain flags, no quotes
        type: string
        required: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ${{ fromJSON(inputs.runner || vars.CI_RUNNER_LIGHT || vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # the gate first, and it must leave a RECEIPT: an exit 0 that never scanned (a flag that
      # short-circuits, a policy that only runs the kit's own proof) writes none
      - name: no declared literal outside its declared source
        uses: mjdevaccount/ci-kit@v1
        env:
          CI_KIT_DECLARED_LITERAL_RECEIPT: ${{ runner.temp }}/declared-literal.receipt
        with:
          tool: ci-declared-literal
          args: ${{ inputs.args }}
      - name: the gate step scanned the tree
        env:
          RECEIPT: ${{ runner.temp }}/declared-literal.receipt
        run: |
          cat "$RECEIPT" 2>/dev/null || true
          grep -Eq '^read=[1-9][0-9]* rules=[1-9]' "$RECEIPT" 2>/dev/null \
            || { echo "::error::the gate step left no scan receipt: it exited without reading the tree"; exit 2; }
      - name: declared-literal selftest
        uses: mjdevaccount/ci-kit@v1
        with:
          tool: ci-declared-literal
          args: --selftest
